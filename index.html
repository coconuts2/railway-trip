<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>12日間 鉄道旅行ルートマップ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;}
#app{display:flex;flex-direction:column;height:100vh;}
#header{padding:7px 14px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap;}
#header h1{font-size:13px;font-weight:600;color:#222;}
#status-bar{font-size:11px;color:#888;margin-left:auto;display:flex;align-items:center;gap:6px;}
#progress{width:100px;height:5px;background:#eee;border-radius:3px;overflow:hidden;}
#progress-fill{height:100%;background:#534AB7;width:0%;transition:width 0.3s;}
#cache-btn{background:#f0f0f0;border:none;border-radius:5px;padding:2px 8px;cursor:pointer;font-size:10px;color:#666;}
#cache-btn:hover{background:#e0e0e0;}
#main{display:flex;flex:1;min-height:0;}
#map{flex:1;min-width:0;}
#panel{width:278px;min-width:278px;background:#fff;border-left:1px solid #e0e0e0;overflow-y:auto;font-size:12px;position:relative;}
#ph{padding:8px 12px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:2;}
#ph h2{font-size:12px;font-weight:600;color:#222;}
#ph p{margin-top:2px;font-size:10px;color:#888;}
.day-block{border-bottom:1px solid #eee;}
.day-label{padding:4px 12px;font-size:11px;font-weight:600;color:#555;background:#f8f8f5;display:flex;justify-content:space-between;}
.seg-row{padding:5px 30px 5px 16px;cursor:pointer;border-top:1px solid #f0f0f0;position:relative;}
.seg-row:hover{background:#f5f5f0;}
.seg-row.active{background:#eef4ff;outline:2px solid #4477cc;outline-offset:-2px;}
.seg-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle;}
.seg-name{font-weight:600;color:#222;font-size:11px;vertical-align:middle;}
.seg-time{color:#666;font-size:10px;margin-top:1px;}
.seg-note{color:#888;font-size:10px;margin-top:1px;line-height:1.4;}
.warn{color:#c84800;}
.seg-icon{position:absolute;right:6px;top:6px;font-size:10px;line-height:1;}
#det{display:none;position:absolute;top:0;right:0;width:278px;height:100%;background:#fff;border-left:1px solid #e0e0e0;overflow-y:auto;z-index:20;box-shadow:-3px 0 10px rgba(0,0,0,0.08);}
#det-head{display:flex;align-items:flex-start;gap:6px;padding:8px 12px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:3;}
#det-title{font-size:11px;font-weight:600;color:#222;flex:1;line-height:1.4;}
#det-close{background:#f0f0f0;border:none;border-radius:5px;padding:2px 7px;cursor:pointer;font-size:11px;color:#555;flex-shrink:0;}
#det-body{padding:11px;}
.det-badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:10px;font-weight:600;margin-bottom:7px;}
.det-route{background:#f8f8f5;border-radius:6px;padding:6px 9px;margin-bottom:7px;}
.det-route h3{font-size:11px;font-weight:600;color:#333;margin-bottom:2px;}
.det-route p{font-size:10px;color:#666;line-height:1.5;}
.box-tip{background:#edf7f2;border-left:3px solid #1a9e75;border-radius:0 5px 5px 0;padding:6px 9px;font-size:11px;line-height:1.6;color:#0a5c3f;margin-bottom:6px;}
.box-warn{background:#fff8ec;border-left:3px solid #e08800;border-radius:0 5px 5px 0;padding:6px 9px;font-size:11px;line-height:1.6;color:#7a4a00;margin-bottom:6px;}
.box-info{background:#eef4ff;border-left:3px solid #4477cc;border-radius:0 5px 5px 0;padding:6px 9px;font-size:11px;line-height:1.6;color:#1a3a7a;margin-bottom:6px;}
#legend{display:flex;flex-wrap:wrap;gap:7px;padding:5px 12px;background:#fff;border-top:1px solid #e0e0e0;font-size:11px;flex-shrink:0;}
.leg-item{display:flex;align-items:center;gap:4px;color:#555;}
.leg-line{width:18px;height:3px;border-radius:2px;}
/* レスポンシブ対応 */
@media (max-width:768px){
  #main{flex-direction:column;}
  #panel{width:100%;min-width:0;border-left:none;border-top:1px solid #e0e0e0;height:40vh;overflow-y:auto;}
  #map{height:60vh;flex:none;}
  #det{width:100%;height:40vh;top:auto;bottom:0;}
  #header h1{font-size:12px;}
}
</style>
</head>

    <div id="det-body"></div>
  </div>
</div>
<div id="legend"></div>
</div>

// =====================================================================
// ローカルストレージキャッシュ
// =====================================================================
function cacheGet(query) {
  try {
    const raw = localStorage.getItem("osm_" + btoa(unescape(encodeURIComponent(query))));
    if (!raw) return null;
    const {ts, data} = JSON.parse(raw);
    if (Date.now() - ts > CACHE_TTL) { localStorage.removeItem("osm_" + btoa(unescape(encodeURIComponent(query)))); return null; }
    return data;
  } catch(e) { return null; }
}
function cacheSet(query, data) {
  try {
    const key = "osm_" + btoa(unescape(encodeURIComponent(query)));
    localStorage.setItem(key, JSON.stringify({ts: Date.now(), data}));
  } catch(e) {}
}
function clearCache() {
  const keys = Object.keys(localStorage).filter(k => k.startsWith("osm_"));
  keys.forEach(k => localStorage.removeItem(k));
  alert(`キャッシュを${keys.length}件削除しました。ページをリロードすると再取得します。`);
}

// =====================================================================
// Overpass API（キャッシュ付き・同時実行数制限付き）
// =====================================================================
let lastRequestTime = 0;

async function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

async function fetchOverpass(query) {
  const cached = cacheGet(query);
  if (cached) return cached;

  for (let attempt = 0; attempt < MAX_RETRY; attempt++) {
    // リクエスト間隔を確保
    const now = Date.now();
    const elapsed = now - lastRequestTime;
    if (elapsed < REQUEST_INTERVAL) {
      await sleep(REQUEST_INTERVAL - elapsed);
    }

    for (const ep of ENDPOINTS) {
      try {
        lastRequestTime = Date.now();
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 60000);
        const res = await fetch(ep, {
          method: "POST",
          headers: {"Content-Type": "application/x-www-form-urlencoded"},
          body: "data=" + encodeURIComponent(query),
          signal: controller.signal,
        });
        clearTimeout(timer);

        if (res.status === 429) {
          // レート制限 → 待機してリトライ
          const waitSec = Math.round(RETRY_WAIT / 1000);
          document.getElementById('status-text').textContent =
            `⏳ レート制限中… ${waitSec}秒待機後リトライ (${attempt+1}/${MAX_RETRY})`;
          await sleep(RETRY_WAIT);
          break; // 次のattemptへ
        }
        if (!res.ok) continue; // 他のエンドポイントを試す

        const data = await res.json();
        cacheSet(query, data);
        return data;
      } catch(e) {
        // タイムアウト・接続エラーは次のエンドポイントへ
      }
    }
  }
  return null;
}

// 完全シリアル実行（同時実行数=1）
async function runWithConcurrency(tasks, limit) {
  for (const task of tasks) {
    try { await task(); } catch(e) {}
  }
}

// =====================================================================
// 線路geometry抽出（BFSで2駅間のみ）
// =====================================================================
function haversine(a, b) {
  const R = 6371000, dLat = (b[0]-a[0])*Math.PI/180, dLon = (b[1]-a[1])*Math.PI/180;
  const x = Math.sin(dLat/2)**2 + Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.asin(Math.sqrt(x));
}

function buildSyntheticGraph(wayElements) {
  const nodes = {}, adj = {};
  let id = 1e9;
  for (const el of wayElements) {
    if (el.type !== "way") continue;
    const geom = el.geometry;
    if (!geom || geom.length < 2) continue;
    const ids = geom.map(g => {
      const nid = id++;
      nodes[nid] = [g.lat, g.lon];
      return nid;
    });
    for (let i = 0; i < ids.length - 1; i++) {
      const a = ids[i], b = ids[i+1];
      (adj[a] = adj[a]||[]).push(b);
      (adj[b] = adj[b]||[]).push(a);
    }
  }
  return {nodes, adj};
}

function nearestNode(nodes, coord) {
  let bestId = null, bestD = Infinity;
  for (const [id, pos] of Object.entries(nodes)) {
    const d = haversine(pos, coord);
    if (d < bestD) { bestD = d; bestId = id; }
  }
  return bestId;
}

function bfsPath(adj, startId, endId, maxNodes = 5000) {
  if (startId === endId) return [startId];
  const visited = new Set([String(startId)]);
  const queue = [[startId, [startId]]];
  let count = 0;
  while (queue.length > 0 && count++ < maxNodes) {
    const [cur, path] = queue.shift();
    for (const next of (adj[cur]||[])) {
      const nk = String(next);
      if (nk === String(endId)) return [...path, next];
      if (!visited.has(nk)) {
        visited.add(nk);
        queue.push([next, [...path, next]]);
      }
    }
  }
  return null;
}

async function fetchRailCoords(seg) {
  const [S,W,N,E] = seg.bbox;
  const railTag = seg.railTag || "rail";

  // 駅検索クエリ
  const stQuery = `[out:json][timeout:20];(node["railway"="station"]["name"="${seg.fromName}"](${S},${W},${N},${E});node["railway"="halt"]["name"="${seg.fromName}"](${S},${W},${N},${E});node["railway"="tram_stop"]["name"="${seg.fromName}"](${S},${W},${N},${E});node["railway"="station"]["name"="${seg.toName}"](${S},${W},${N},${E});node["railway"="halt"]["name"="${seg.toName}"](${S},${W},${N},${E});node["railway"="tram_stop"]["name"="${seg.toName}"](${S},${W},${N},${E}););out body;`;
  // 線路クエリ（railway=railまたはtramのみ、道路除外）
  const wayQuery = `[out:json][timeout:40];way["railway"="${railTag}"](${S},${W},${N},${E});out geom;`;

  const [stData, wayData] = await Promise.all([
    fetchOverpass(stQuery).catch(()=>null),
    fetchOverpass(wayQuery).catch(()=>null),
  ]);

  if (!wayData?.elements) return null;
  const wayEls = wayData.elements.filter(e => e.type==="way");
  if (wayEls.length === 0) return null;

  // 駅座標特定
  let fromCoord = null, toCoord = null;
  if (stData?.elements) {
    const fromNodes = stData.elements.filter(e => e.type==="node" && e.tags?.name?.includes(seg.fromName));
    const toNodes   = stData.elements.filter(e => e.type==="node" && e.tags?.name?.includes(seg.toName));
    if (fromNodes.length > 0) fromCoord = [fromNodes[0].lat, fromNodes[0].lon];
    if (toNodes.length > 0)   toCoord   = [toNodes[0].lat,  toNodes[0].lon];
  }

  // fallback座標から始終点を推定
  if (!fromCoord && seg.fallback?.length > 0) fromCoord = seg.fallback[0];
  if (!toCoord   && seg.fallback?.length > 1) toCoord   = seg.fallback[seg.fallback.length-1];
  if (!fromCoord || !toCoord) return null;

  // グラフ構築・BFS
  const {nodes, adj} = buildSyntheticGraph(wayEls);
  if (Object.keys(nodes).length === 0) return null;

  const startId = nearestNode(nodes, fromCoord);
  const endId   = nearestNode(nodes, toCoord);
  if (!startId || !endId) return null;

  const path = bfsPath(adj, startId, endId);
  if (!path || path.length < 2) return null;

  return path.map(id => nodes[id]).filter(Boolean);
}

const map = L.map('map').setView([35.0, 134.5], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom:19
}).addTo(map);

const plMap = {}; // key→{fallback?:pl, osm?:pl}
let activePl = null, activeRow = null;

function makePl(coords, seg) {
  const t = T[seg.type];
  const pl = L.polyline(coords, {color:t.color, weight:t.w, dashArray:t.dash, opacity:0.85});
  pl._baseW = t.w; pl._active = false;
  pl.bindTooltip(
    `<b>${seg.name}</b><br>${seg.from} <b>${seg.dep}</b> → ${seg.to} <b>${seg.arr}</b><br><span style="color:#666">${seg.note}</span>`,
    {sticky:true, direction:'top'}
  );
  pl.on('mouseover', function(){ if(!this._active) this.setStyle({weight:this._baseW+2,opacity:1}); });
  pl.on('mouseout',  function(){ if(!this._active) this.setStyle({weight:this._baseW,opacity:0.85}); });
  pl.on('click', ()=> selectSeg(seg.di, seg.si));
  return pl;
}

function putFallback(seg) {
  if (!seg.fallback?.length) return;
  const key = `${seg.di}-${seg.si}`;
  if (plMap[key]?.osm || plMap[key]?.fallback) return;
  const pl = makePl(seg.fallback, seg);
  pl.addTo(map);
  plMap[key] = {fallback: pl};
}

function putOsm(seg, coords) {
  const key = `${seg.di}-${seg.si}`;
  const entry = plMap[key] || {};
  // fallbackを削除
  if (entry.fallback) { map.removeLayer(entry.fallback); delete entry.fallback; }
  // 既存OSMも削除
  if (entry.osm) { map.removeLayer(entry.osm); }
  const pl = makePl(coords, seg);
  pl.addTo(map);
  plMap[key] = {osm: pl};
  const icon = document.getElementById(`icon-${seg.di}-${seg.si}`);
  if (icon) icon.textContent = '🗺';
}

function getActivePl(di, si) {
  const e = plMap[`${di}-${si}`];
  return e?.osm || e?.fallback || null;
}

function resetActive() {
  if (activePl) { activePl._active=false; activePl.setStyle({weight:activePl._baseW,opacity:0.85}); activePl=null; }
  if (activeRow) { activeRow.classList.remove('active'); activeRow=null; }
}
function selectSeg(di, si) {
  resetActive();
  const pl = getActivePl(di, si);
  if (!pl) return;
  pl._active=true; pl.setStyle({weight:pl._baseW+3,opacity:1}); activePl=pl;
  map.fitBounds(pl.getBounds(), {padding:[50,50]});
  const row = document.getElementById(`r-${di}-${si}`);
  if (row) { row.classList.add('active'); row.scrollIntoView({block:'nearest'}); activeRow=row; }
  const seg = SEGS.find(s=>s.di===di&&s.si===si);
  if (seg) showDet(seg);
}
function showDet(seg) {
  const t=T[seg.type], d=seg.detail||{};
  const title = document.getElementById('det-title');
  title.textContent = seg.name;
  const body = document.getElementById('det-body');
  body.innerHTML = '';
  const badge = document.createElement('div');
  badge.className='det-badge';
  badge.style.cssText=`background:${t.color}22;color:${t.color}`;
  badge.textContent=t.label;
  body.appendChild(badge);
  const route = document.createElement('div');
  route.className='det-route';
  const h3=document.createElement('h3'); h3.textContent=`${seg.from} ${seg.dep} → ${seg.to} ${seg.arr}`;
  const p=document.createElement('p'); p.textContent=seg.note;
  route.appendChild(h3); route.appendChild(p);
  body.appendChild(route);
  [['tip','box-tip'],['warn','box-warn'],['info','box-info']].forEach(([k,cls])=>{
    if (d[k]) { const el=document.createElement('div'); el.className=cls; el.textContent=d[k]; body.appendChild(el); }
  });
  document.getElementById('det').style.display='block';
}
function closeDet() { document.getElementById('det').style.display='none'; resetActive(); }

// =====================================================================
// パネル構築
// =====================================================================
const panelBody = document.getElementById('panel-body');
let prevDi = -1;
for (const seg of SEGS) {
  if (seg.di !== prevDi) {
    const blk=document.createElement('div'); blk.className='day-block'; blk.id=`day-${seg.di}`;
    const dl=document.createElement('div'); dl.className='day-label';
    dl.textContent=DAY_LABELS[seg.di];
    blk.appendChild(dl); panelBody.appendChild(blk); prevDi=seg.di;
  }
  const t=T[seg.type];
  const blk=document.getElementById(`day-${seg.di}`);
  const row=document.createElement('div'); row.className='seg-row'; row.id=`r-${seg.di}-${seg.si}`;
  // 各要素をtextContentで構築（XSS対策）
  const nameRow=document.createElement('div'); nameRow.style.display='flex'; nameRow.style.alignItems='center';
  const dot=document.createElement('span'); dot.className='seg-dot'; dot.style.background=t.color;
  const nameEl=document.createElement('span'); nameEl.className='seg-name'; nameEl.textContent=seg.name;
  nameRow.appendChild(dot); nameRow.appendChild(nameEl);
  const timeEl=document.createElement('div'); timeEl.className='seg-time';
  timeEl.textContent=`${seg.from} ${seg.dep} → ${seg.to} ${seg.arr}`;
  // 時刻の太字
  const timeHtml = `${seg.from} <b>${seg.dep}</b> → ${seg.to} <b>${seg.arr}</b>`;
  timeEl.innerHTML = timeHtml;
  const noteEl=document.createElement('div'); noteEl.className='seg-note'+(seg.warn?' warn':'');
  noteEl.textContent=seg.note;
  const icon=document.createElement('span'); icon.className='seg-icon'; icon.id=`icon-${seg.di}-${seg.si}`;
  icon.textContent=seg.fromName?'⏳':'';
  row.appendChild(nameRow); row.appendChild(timeEl); row.appendChild(noteEl); row.appendChild(icon);
  row.addEventListener('click', ()=>selectSeg(seg.di, seg.si));
  blk.appendChild(row);
}

// 凡例
const legBar=document.getElementById('legend');
for (const [,t] of Object.entries(T)) {
  const el=document.createElement('div'); el.className='leg-item';
  const line=document.createElement('div'); line.className='leg-line'; line.style.background=t.color;
  const label=document.createTextNode(t.label);
  el.appendChild(line); el.appendChild(label); legBar.appendChild(el);
}

// =====================================================================
// 読み込み実行
// =====================================================================
let done=0;
const total=SEGS.length;
document.getElementById('progress-label').textContent=`0/${total}`;

async function loadOneSeg(seg) {
  // 現在取得中の区間名を表示
  document.getElementById('status-text').textContent = `取得中: ${seg.name}`;

  // 1. フォールバックを即座に描画
  putFallback(seg);

  // 2. OSMクエリがある区間のみ精細化
  if (seg.fromName && seg.toName && seg.bbox) {
    let coords = null;
    try {
      coords = await fetchRailCoords(seg);
    } catch(e) {}
    const icon = document.getElementById(`icon-${seg.di}-${seg.si}`);
    if (coords && coords.length >= 2) {
      putOsm(seg, coords);
    } else {
      if (icon) icon.textContent = '⚠'; // 取得失敗を明示
    }
  }

  done++;
  const pct = Math.round(done/total*100);
  document.getElementById('progress-fill').style.width = pct+'%';
  document.getElementById('progress-label').textContent = `${done}/${total}`;
  if (done >= total) {
    document.getElementById('status-text').textContent = '✅ 読み込み完了';
    // 全ルートにfitBounds
    const allPls = Object.values(plMap).map(e=>e.osm||e.fallback).filter(Boolean);
    if (allPls.length > 0) {
      try { map.fitBounds(L.featureGroup(allPls).getBounds(), {padding:[20,20]}); } catch(e){}
    }
  } else {
    const next = SEGS[done];
    const detail = next ? `　次: ${next.name}` : '';
    document.getElementById('status-text').textContent = `取得中... ${detail}`;
  }
}

// 全区間を同時実行数制限付きで並列実行
runWithConcurrency(SEGS.map(seg => () => loadOneSeg(seg)), CONCURRENCY);
</script>
