<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鉄道旅行ルートマップ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;}
#app{display:flex;flex-direction:column;height:100vh;}
#header{padding:7px 14px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap;}
#header h1{font-size:13px;font-weight:600;color:#222;}
#status-bar{font-size:11px;color:#888;margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
#progress{width:90px;height:5px;background:#eee;border-radius:3px;overflow:hidden;}
#progress-fill{height:100%;background:#534AB7;width:0%;transition:width 0.3s;}
.hbtn{background:#f0f0f0;border:none;border-radius:5px;padding:3px 9px;cursor:pointer;font-size:10px;color:#555;white-space:nowrap;}
.hbtn:hover{background:#e3e3e3;}
#main{display:flex;flex:1;min-height:0;}
#map{flex:1;min-width:0;background:#eef0f2;}
#panel{width:280px;min-width:280px;background:#fff;border-left:1px solid #e0e0e0;overflow-y:auto;font-size:12px;position:relative;}
#ph{padding:8px 12px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:2;}
#ph h2{font-size:12px;font-weight:600;color:#222;}
#ph p{margin-top:2px;font-size:10px;color:#888;}
.day-block{border-bottom:1px solid #eee;}
.day-label{padding:4px 12px;font-size:11px;font-weight:600;color:#555;background:#f8f8f5;}
.seg-row{padding:5px 30px 5px 16px;cursor:pointer;border-top:1px solid #f0f0f0;position:relative;}
.seg-row:hover{background:#f5f5f0;}
.seg-row.active{background:#eef4ff;outline:2px solid #4477cc;outline-offset:-2px;}
.seg-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle;}
.seg-name{font-weight:600;color:#222;font-size:11px;vertical-align:middle;}
.seg-time{color:#666;font-size:10px;margin-top:1px;}
.seg-note{color:#888;font-size:10px;margin-top:1px;line-height:1.4;}
.warn{color:#c84800;}
.seg-icon{position:absolute;right:6px;top:6px;font-size:10px;line-height:1;cursor:help;}
#det{display:none;position:absolute;top:0;right:0;width:280px;height:100%;background:#fff;border-left:1px solid #e0e0e0;overflow-y:auto;z-index:20;box-shadow:-3px 0 10px rgba(0,0,0,0.08);}
#det-head{display:flex;align-items:flex-start;gap:6px;padding:8px 12px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:3;}
#det-title{font-size:11px;font-weight:600;color:#222;flex:1;line-height:1.4;}
#det-close{background:#f0f0f0;border:none;border-radius:5px;padding:2px 7px;cursor:pointer;font-size:11px;color:#555;flex-shrink:0;}
#det-body{padding:11px;}
.det-badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:10px;font-weight:600;margin-bottom:7px;}
.det-route{background:#f8f8f5;border-radius:6px;padding:6px 9px;margin-bottom:7px;}
.det-route h3{font-size:11px;font-weight:600;color:#333;margin-bottom:2px;}
.det-route p{font-size:10px;color:#666;line-height:1.5;}
.box-tip{background:#edf7f2;border-left:3px solid #1a9e75;border-radius:0 5px 5px 0;padding:6px 9px;font-size:11px;line-height:1.6;color:#0a5c3f;margin-bottom:6px;}
.box-warn{background:#fff8ec;border-left:3px solid #e08800;border-radius:0 5px 5px 0;padding:6px 9px;font-size:11px;line-height:1.6;color:#7a4a00;margin-bottom:6px;}
.box-info{background:#eef4ff;border-left:3px solid #4477cc;border-radius:0 5px 5px 0;padding:6px 9px;font-size:11px;line-height:1.6;color:#1a3a7a;margin-bottom:6px;}
#legend{display:flex;flex-wrap:wrap;gap:7px;padding:5px 12px;background:#fff;border-top:1px solid #e0e0e0;font-size:11px;flex-shrink:0;}
.leg-item{display:flex;align-items:center;gap:4px;color:#555;}
.leg-line{width:18px;height:3px;border-radius:2px;}
/* ログウィンドウ */
#log-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:1000;}
#log-win{position:absolute;top:5%;left:50%;transform:translateX(-50%);width:90%;max-width:900px;height:85%;background:#fff;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,0.3);display:flex;flex-direction:column;overflow:hidden;}
#log-head{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid #e0e0e0;background:#fafafa;}
#log-head h2{font-size:14px;font-weight:600;color:#222;flex:1;}
#log-filter{font-size:11px;padding:3px 6px;border:1px solid #ccc;border-radius:4px;margin-right:8px;}
#log-body{flex:1;overflow-y:auto;padding:0;font-family:'SF Mono',Consolas,'Courier New',monospace;font-size:11px;}
.log-seg{border-bottom:1px solid #eee;}
.log-seg-head{padding:7px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;background:#fff;}
.log-seg-head:hover{background:#f5f5f5;}
.log-seg-head.ok{border-left:3px solid #1a9e75;}
.log-seg-head.fallback{border-left:3px solid #e08800;}
.log-seg-head.error{border-left:3px solid #d04545;}
.log-seg-status{font-size:13px;}
.log-seg-name{font-weight:600;color:#333;flex:1;font-family:-apple-system,sans-serif;}
.log-seg-time{color:#999;font-size:10px;}
.log-detail{display:none;padding:8px 14px 12px 28px;background:#fafafa;color:#444;line-height:1.7;white-space:pre-wrap;}
.log-detail.open{display:block;}
.log-step{color:#666;}
.log-step b{color:#222;}
.log-ok{color:#1a7d56;}
.log-warn{color:#c47800;}
.log-err{color:#c03030;}
#log-summary{padding:8px 14px;background:#f0f4ff;border-bottom:1px solid #dde;font-family:-apple-system,sans-serif;font-size:12px;color:#334;}
/* ファイル読込画面 */
#loader-screen{position:fixed;inset:0;background:#f5f6f8;z-index:2000;display:flex;align-items:center;justify-content:center;}
#loader-box{background:#fff;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,0.1);padding:32px 40px;max-width:480px;text-align:center;}
#loader-box h1{font-size:18px;color:#222;margin-bottom:8px;}
#loader-box p{font-size:13px;color:#777;line-height:1.7;margin-bottom:20px;}
#drop-zone{border:2px dashed #ccc;border-radius:10px;padding:30px 20px;cursor:pointer;transition:all 0.2s;margin-bottom:14px;}
#drop-zone:hover,#drop-zone.dragover{border-color:#534AB7;background:#f8f7ff;}
#drop-zone .icon{font-size:36px;margin-bottom:8px;}
#drop-zone .txt{font-size:13px;color:#555;}
#drop-zone .sub{font-size:11px;color:#aaa;margin-top:4px;}
.loader-btn{background:#534AB7;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:13px;cursor:pointer;margin:4px;}
.loader-btn:hover{background:#433a9e;}
.loader-btn.alt{background:#eee;color:#555;}
.loader-btn.alt:hover{background:#e0e0e0;}
#loader-err{color:#c03030;font-size:12px;margin-top:10px;min-height:16px;}
@media (max-width:768px){
  #main{flex-direction:column;}
  #panel{width:100%;min-width:0;border-left:none;border-top:1px solid #e0e0e0;height:40vh;}
  #map{height:60vh;flex:none;}
  #det{width:100%;height:50vh;top:auto;bottom:0;}
}
</style>
</head>
<body>

<!-- ファイル読込画面 -->
<div id="loader-screen">
  <div id="loader-box">
    <h1>🚄 鉄道旅行ルートマップ</h1>
    <p>旅程データ（itinerary.json）を読み込んでください。<br>地図上にルートを描画します。</p>
    <div id="drop-zone">
      <div class="icon">📁</div>
      <div class="txt">クリックして選択 / ドラッグ&ドロップ</div>
      <div class="sub">itinerary.json</div>
    </div>
    <input type="file" id="file-input" accept=".json,application/json" style="display:none">
    <div>
      <button class="loader-btn alt" onclick="tryAutoLoad()">同じ階層の itinerary.json を自動読込</button>
    </div>
    <div id="loader-err"></div>
  </div>
</div>

<div id="app" style="display:none;">
<div id="header">
  <h1 id="trip-title">🚄 鉄道旅行ルートマップ</h1>
  <div id="status-bar">
    <span id="status-text">準備中...</span>
    <div id="progress"><div id="progress-fill"></div></div>
    <span id="progress-label">0/0</span>
    <button class="hbtn" onclick="openLog()">📋 ログ</button>
    <button class="hbtn" onclick="clearCache()">🗑 キャッシュ削除</button>
    <button class="hbtn" onclick="reload()">📁 別データ</button>
  </div>
</div>
<div id="main">
  <div id="map"></div>
  <div id="panel">
    <div id="ph"><h2>全行程</h2><p>クリックで地図ズーム・詳細を表示</p></div>
    <div id="panel-body"></div>
  </div>
  <div id="det">
    <div id="det-head"><span id="det-title"></span><button id="det-close" onclick="closeDet()">✕ 閉じる</button></div>
    <div id="det-body"></div>
  </div>
</div>
<div id="legend"></div>
</div>

<!-- ログウィンドウ -->
<div id="log-overlay" onclick="if(event.target===this)closeLog()">
  <div id="log-win">
    <div id="log-head">
      <h2>📋 取得ログ</h2>
      <select id="log-filter" onchange="renderLog()">
        <option value="all">すべて表示</option>
        <option value="ok">API成功のみ</option>
        <option value="fallback">fallback採用のみ</option>
        <option value="error">エラーのみ</option>
      </select>
      <button class="hbtn" onclick="closeLog()">✕ 閉じる</button>
    </div>
    <div id="log-summary"></div>
    <div id="log-body"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
<script>
// =====================================================================
// 設定
// =====================================================================
const CACHE_TTL = 7*24*60*60*1000;
const REQUEST_INTERVAL = 2000;
const RETRY_WAIT = 30000;
const MAX_RETRY = 3;
const STITCH_GAP = 1000;       // way連結の最大ギャップ(m)
const NEAR_STATION = 800;      // 端点が駅とみなせる距離(m)
const ENDPOINTS = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter",
];

const T = {
  shinkansen:{label:'新幹線',color:'#534AB7',dash:null,w:5},
  kanko:{label:'観光列車',color:'#D85A30',dash:'8,5',w:4},
  tokkyu:{label:'特急・在来線',color:'#185FA5',dash:'4,3',w:3},
  local:{label:'ローカル線',color:'#854F0B',dash:'6,4',w:3},
  ferry:{label:'船・フェリー',color:'#0F6E56',dash:'4,4',w:3},
  bus:{label:'バス・路面電車',color:'#4a9922',dash:'4,3',w:2},
  taxi:{label:'タクシー',color:'#888780',dash:'3,4',w:2},
  plane:{label:'飛行機',color:'#3C3489',dash:'2,6',w:4},
};

// グローバル状態
let SEGS = [];
let DAY_LABELS = [];
let map = null;
const plMap = {};
let activePl = null, activeRow = null;
const LOG = {}; // key -> ログオブジェクト

// =====================================================================
// ファイル読み込み
// =====================================================================
const fileInput = document.getElementById('file-input');
const dropZone = document.getElementById('drop-zone');

dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  if (e.target.files.length) loadFile(e.target.files[0]);
});
['dragover','dragenter'].forEach(ev =>
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('dragover'); }));
['dragleave','drop'].forEach(ev =>
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('dragover'); }));
dropZone.addEventListener('drop', e => {
  if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
});

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      startApp(data);
    } catch(err) {
      document.getElementById('loader-err').textContent = '読み込み失敗: ' + err.message;
    }
  };
  reader.readAsText(file);
}

async function tryAutoLoad() {
  document.getElementById('loader-err').textContent = '読込中...';
  try {
    const res = await fetch('itinerary.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    startApp(data);
  } catch(err) {
    document.getElementById('loader-err').textContent =
      '自動読込失敗（' + err.message + '）。file://では使えません。ファイルを手動選択してください。';
  }
}

function startApp(data) {
  SEGS = data.segs || [];
  DAY_LABELS = data.dayLabels || [];
  if (data.title) {
    document.getElementById('trip-title').textContent = '🚄 ' + data.title;
    document.title = data.title;
  }
  document.getElementById('loader-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  initMapAndUI();
}

function reload() { location.reload(); }

// =====================================================================
// localStorageキャッシュ
// =====================================================================
function cacheKey(q){ return "osm_" + btoa(unescape(encodeURIComponent(q))); }
function cacheGet(q){
  try {
    const raw = localStorage.getItem(cacheKey(q));
    if (!raw) return null;
    const {ts,data} = JSON.parse(raw);
    if (Date.now()-ts > CACHE_TTL){ localStorage.removeItem(cacheKey(q)); return null; }
    return data;
  } catch(e){ return null; }
}
function cacheSet(q,data){
  try { localStorage.setItem(cacheKey(q), JSON.stringify({ts:Date.now(),data})); } catch(e){}
}
function clearCache(){
  const ks = Object.keys(localStorage).filter(k=>k.startsWith("osm_"));
  ks.forEach(k=>localStorage.removeItem(k));
  alert(`キャッシュを${ks.length}件削除しました。リロードで再取得します。`);
}

// =====================================================================
// Overpass
// =====================================================================
let lastReq = 0;
const sleep = ms => new Promise(r=>setTimeout(r,ms));

async function fetchOverpass(query, logArr) {
  const cached = cacheGet(query);
  if (cached) { logArr && logArr.push({t:'cache', msg:'キャッシュHIT'}); return {data:cached, cached:true}; }

  for (let attempt=0; attempt<MAX_RETRY; attempt++){
    const wait = REQUEST_INTERVAL - (Date.now()-lastReq);
    if (wait > 0) await sleep(wait);

    for (const ep of ENDPOINTS){
      try {
        lastReq = Date.now();
        const ctrl = new AbortController();
        const timer = setTimeout(()=>ctrl.abort(), 60000);
        const res = await fetch(ep, {
          method:"POST",
          headers:{"Content-Type":"application/x-www-form-urlencoded"},
          body:"data="+encodeURIComponent(query),
          signal:ctrl.signal,
        });
        clearTimeout(timer);
        if (res.status === 429){
          logArr && logArr.push({t:'warn', msg:`429 レート制限 → ${RETRY_WAIT/1000}秒待機 (${attempt+1}/${MAX_RETRY})`});
          document.getElementById('status-text').textContent = `⏳ レート制限中…${RETRY_WAIT/1000}秒待機`;
          await sleep(RETRY_WAIT);
          break;
        }
        if (!res.ok){ logArr && logArr.push({t:'warn', msg:`${ep.split('/')[2]} → HTTP ${res.status}`}); continue; }
        const data = await res.json();
        cacheSet(query, data);
        return {data, cached:false, endpoint:ep.split('/')[2]};
      } catch(e){
        const reason = e.name==='AbortError' ? 'タイムアウト(60秒)' : e.message;
        logArr && logArr.push({t:'err', msg:`${ep.split('/')[2]} → ${reason}`});
      }
    }
  }
  return {data:null, cached:false};
}

// =====================================================================
// 幾何ユーティリティ
// =====================================================================
function haversine(a,b){
  const R=6371000, dLat=(b[0]-a[0])*Math.PI/180, dLon=(b[1]-a[1])*Math.PI/180;
  const x=Math.sin(dLat/2)**2 + Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.asin(Math.sqrt(x));
}
function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

// wayを始点→終点の順に連結し、乗降駅間だけを経路順に抽出する
// ポイント: 連結後のchainを「始点からの経路距離（累積距離）」で順序づけ、
// 始点・終点に最も近い点の間だけをスライスする。
// これによりジグザグや巻き込み（途中で別方向に伸びた支線）を排除する。
function stitchWays(ways, startCoord, endCoord, log) {
  if (!ways || ways.length === 0) return [];

  log.push({t:'info', msg: `--- 連結アルゴリズム開始 (入力Way数: ${ways.length}) ---`});

  // ==========================================
  // STEP 1: リレーション(または路線名・系統名)ごとにWayをグルーピング
  // ==========================================
  const groups = {};
  ways.forEach(w => {
    // リレーションIDがあればそれをキーに、なければnameや固定値を使う
    const relId = w.relId || (w.tags && w.tags.name) || "unknown_line";
    if (!groups[relId]) groups[relId] = [];
    // points配列が存在することを確認
    const pts = w.points ? w.points : w;
    if (pts && pts.length > 0) {
      groups[relId].push(pts);
    }
  });

  const relIds = Object.keys(groups);
  log.push({t:'info', msg: `検出された独立リレーション数: ${relIds.length} (${relIds.join(', ')})`});

  // ==========================================
  // STEP 2: 各リレーション(グループ)内で、それぞれ「独立した1本道(独立チェーン)」を作る
  // ==========================================
  const independentChains = [];
  
  relIds.forEach(relId => {
    let pool = groups[relId].map(p => p.slice());
    if (pool.length === 0) return;

    // 最初の1本を取り出してベースにする
    let chain = pool.shift();
    let progress = true;

    // グループ内だけで数珠繋ぎ連結（Greedy法）を行う
    while (progress && pool.length > 0) {
      progress = false;
      const head = chain[0];
      const tail = chain[chain.length - 1];

      for (let i = 0; i < pool.length; i++) {
        const p = pool[i];
        const pHead = p[0];
        const pTail = p[p.length - 1];

        // 末尾(tail)への接続判定
        if (haversine(tail, pHead) < 0.001) {
          chain = chain.concat(p.slice(1));
          pool.splice(i, 1); progress = true; break;
        }
        if (haversine(tail, pTail) < 0.001) {
          chain = chain.concat(p.slice().reverse().slice(1));
          pool.splice(i, 1); progress = true; break;
        }
        // 先頭(head)への接続判定
        if (haversine(head, pTail) < 0.001) {
          chain = p.slice().concat(chain.slice(1));
          pool.splice(i, 1); progress = true; break;
        }
        if (haversine(head, pHead) < 0.001) {
          chain = p.slice().reverse().concat(chain.slice(1));
          pool.splice(i, 1); progress = true; break;
        }
      }
    }
    
    if (chain && chain.length > 0) {
      independentChains.push({ relId: relId, points: chain });
    }
  });

  // ==========================================
  // STEP 3: 独立チェーン同士をバトンタッチ結合する（和集合の作成）
  // ==========================================
  if (independentChains.length === 0) return [];

  // 乗車駅（startCoord）に最も近い端点を持つチェーンを「主軸（スタート）」に選ぶ
  let currentChainObj = null;
  let minStartDist = Infinity;
  let isReversedStart = false;

  independentChains.forEach(ch => {
    const dHead = haversine(startCoord, ch.points[0]);
    const dTail = haversine(startCoord, ch.points[ch.points.length - 1]);
    if (dHead < minStartDist) { minStartDist = dHead; currentChainObj = ch; isReversedStart = false; }
    if (dTail < minStartDist) { minStartDist = dTail; currentChainObj = ch; isReversedStart = true; }
  });

  // 主軸の方向を「乗車駅 → 降車駅」の方向に整える
  let finalRoute = currentChainObj.points.slice();
  if (isReversedStart) finalRoute.reverse();

  // 使用済みチェーンを管理
  const usedRelIds = new Set([currentChainObj.relId]);

  // まだ接続していないチェーンが残っている限り、末端へバトンタッチ結合を試みる
  let extended = true;
  while (extended) {
    extended = false;
    const currentTail = finalRoute[finalRoute.length - 1];

    let nextChainObj = null;
    let minGap = 0.005; // バトンタッチを許容する最大ギャップ（約500m以内）
    let isReversedNext = false;

    independentChains.forEach(ch => {
      if (usedRelIds.has(ch.relId)) return; // 既に使用した系統はスキップ

      const dHead = haversine(currentTail, ch.points[0]);
      const dTail = haversine(currentTail, ch.points[ch.points.length - 1]);

      if (dHead < minGap) { minGap = dHead; nextChainObj = ch; isReversedNext = false; }
      if (dTail < minGap) { minGap = dTail; nextChainObj = ch; isReversedNext = true; }
    });

    // 接続可能な次の系統（直通先など）が見つかった場合、合体する
    if (nextChainObj) {
      let nextPoints = nextChainObj.points.slice();
      if (isReversedNext) nextPoints.reverse();
      
      // 重複・接続点の重複を避けてマージ
      finalRoute = finalRoute.concat(nextPoints.slice(1));
      usedRelIds.add(nextChainObj.relId);
      log.push({t:'info', msg: `系統接続成功: ${currentChainObj.relId} ➔ ${nextChainObj.relId} (ギャップ: ${Math.round(minGap * 1000)}m)`});
      currentChainObj = nextChainObj;
      extended = true;
    }
  }

  // ==========================================
  // STEP 4: 地理的範囲（乗車駅〜降車駅）による最終切り詰め（はみ出しカット）
  // ==========================================
  const totalStationDist = haversine(startCoord, endCoord);
  
  let result = finalRoute.filter(pt => {
    const dStart = haversine(startCoord, pt);
    const dEnd = haversine(endCoord, pt);
    const margin = 0.5; // 駅の前後500mまでのオーバーラン・引き込み線を許容
    return (dStart <= totalStationDist + margin) && (dEnd <= totalStationDist + margin);
  });

  if (result.length === 0) result = finalRoute; // 万が一全滅した場合は安全策として維持

  // 最終的な進行方向の調整 (result[0]がstartCoordに一番近くなるように)
  if (result.length >= 2) {
    const startDist = haversine(startCoord, result[0]);
    const endDist = haversine(startCoord, result[result.length - 1]);
    if (startDist > endDist) {
      result.reverse();
    }
  }

  log.push({t:'info', msg: `最終描画点数: ${result.length}`});
  return result;
}

// =====================================================================
// 路線データ取得（複数戦略）
// =====================================================================
function calcBbox(seg){
  if(seg.bbox) return seg.bbox;
  if(!seg.fallback?.length) return null;
  let mnLat=90,mxLat=-90,mnLon=180,mxLon=-180;
  seg.fallback.forEach(c=>{
    if(c[0]<mnLat)mnLat=c[0]; if(c[0]>mxLat)mxLat=c[0];
    if(c[1]<mnLon)mnLon=c[1]; if(c[1]>mxLon)mxLon=c[1];
  });
  const pad=0.05;
  return [mnLat-pad, mnLon-pad, mxLat+pad, mxLon+pad];
}

// OSMの駅ノードを探して端点の場所情報を返す
async function identifyEndpoint(coord, bbox, log){
  const [S,W,N,E]=bbox;
  const q=`[out:json][timeout:15];node["railway"="station"](${S},${W},${N},${E});out body;`;
  const {data}=await fetchOverpass(q, log);
  if(!data?.elements) return null;
  let best=null, bd=Infinity;
  for(const n of data.elements){
    if(n.type!=='node'||!n.tags?.name) continue;
    const d=haversine(coord,[n.lat,n.lon]);
    if(d<bd){bd=d;best={name:n.tags.name, dist:d, line:n.tags.line||n.tags.operator||''};}
  }
  return (best&&best.dist<NEAR_STATION)?best:(best?{...best,far:true}:null);
}

// 戦略A: 路線名でrelation取得
async function strategyByLineName(seg, bbox, log){
  const lineNames = seg.lineNames || (seg.lineName?[seg.lineName]:[]);
  if(lineNames.length===0) return null;
  const [S,W,N,E]=bbox;
  const nameRegex = lineNames.map(escapeRegex).join("|");
  // relationのタグ(name)とwayのgeometryの両方を取得する
  // 1行目: relationのタグを出力（路線名取得用）
  // 2行目以降: relationに属するwayのgeometryを出力（描画用）
  const q=`[out:json][timeout:30];
relation["route"~"train|tram|light_rail|monorail|subway|railway"]["name"~"${nameRegex}"](${S},${W},${N},${E});
way(r)["railway"~"rail|tram|light_rail|monorail|subway"];
out geom;
relation["route"~"train|tram|light_rail|monorail|subway|railway"]["name"~"${nameRegex}"](${S},${W},${N},${E});
out tags;`;
  const t0=performance.now();
  const {data, cached, endpoint} = await fetchOverpass(q, log);
  const dt=((performance.now()-t0)/1000).toFixed(1);
  if(!data?.elements){
    log.push({t:'err', msg:`戦略A: データ取得失敗 (${dt}秒)`});
    return null;
  }
  // 取得できた路線名を列挙（relationのtagsから）
  const relNames=[...new Set(data.elements.filter(e=>e.type==='relation').map(e=>e.tags?.name).filter(Boolean))];
  const relIds = data.elements.filter(e => e.type === 'relation').map(e => e.id);
  const wayEls=data.elements.filter(e=>e.type==='way'&&e.geometry?.length>=2);
  log.push({t:'ok', msg:`戦略A: ${cached?'キャッシュ':'API'+(endpoint?'('+endpoint+')':'')}から取得 (${dt}秒)`});
  log.push({t:'info', msg:`　検索した路線名: ${lineNames.join(' / ')}`});
  log.push({t:'info', msg:`　OSMで見つかった路線(${relNames.length}): ${relNames.join(' / ')||'(該当relationなし)'}`});
  log.push({t:'info', msg:`　relationID: ${relIds.join(', ') || 'なし'}`});
  log.push({t:'info', msg:`　way数: ${wayEls.length}`});
  if(wayEls.length===0) return null;
  return {wayEls, relNames};
}

// 戦略B: 乗降駅周辺の全鉄道wayを取得して連結（路線名に依存しない）
async function strategyByArea(seg, bbox, log){
  const fromCoord=seg.fallback?.[0], toCoord=seg.fallback?.[seg.fallback.length-1];
  if(!fromCoord||!toCoord) return null;
  // 乗降駅を含む狭いbboxで全railを取得
  const pad=0.03;
  const S=Math.min(fromCoord[0],toCoord[0])-pad, N=Math.max(fromCoord[0],toCoord[0])+pad;
  const W=Math.min(fromCoord[1],toCoord[1])-pad, E=Math.max(fromCoord[1],toCoord[1])+pad;
  const q=`[out:json][timeout:40];
way["railway"~"rail|tram|light_rail|monorail|subway"](${S},${W},${N},${E});
out geom;`;
  const t0=performance.now();
  const {data, cached, endpoint}=await fetchOverpass(q, log);
  const dt=((performance.now()-t0)/1000).toFixed(1);
  if(!data?.elements){
    log.push({t:'err', msg:`戦略B(エリア): データ取得失敗 (${dt}秒)`});
    return null;
  }
  const wayEls=data.elements.filter(e=>e.type==='way'&&e.geometry?.length>=2);
  log.push({t:'ok', msg:`戦略B(エリア): ${cached?'キャッシュ':'API'+(endpoint?'('+endpoint+')':'')}から取得 (${dt}秒)`});
  log.push({t:'info', msg:`　エリア内way数: ${wayEls.length}`});
  if(wayEls.length===0) return null;
  return {wayEls, relNames:['(エリア検索)']};
}

async function fetchRailCoords(seg, log){
  if(seg.fallbackSkip){ log.push({t:'info', msg:'fallbackSkip指定 → API取得せず直線描画'}); return null; }
  const bbox=calcBbox(seg);
  if(!bbox){ log.push({t:'err', msg:'bbox計算不可'}); return null; }
  const fromCoord=seg.fallback?.[0], toCoord=seg.fallback?.[seg.fallback.length-1];
  if(!fromCoord||!toCoord){ log.push({t:'err', msg:'始終点座標なし'}); return null; }

  log.push({t:'info', msg:`乗車駅(fallback始点): [${fromCoord[0].toFixed(4)}, ${fromCoord[1].toFixed(4)}]`});
  log.push({t:'info', msg:`降車駅(fallback終点): [${toCoord[0].toFixed(4)}, ${toCoord[1].toFixed(4)}]`});

  // --- 戦略A: 路線名 ---
  let res = await strategyByLineName(seg, bbox, log);
  let stitched = null;
  if(res){
    stitched = stitchWays(res.wayEls, fromCoord, toCoord);
    if(stitched){
      log.push({t:'info', msg:`　連結: ${stitched.usedWays}/${stitched.totalWays} wayを使用`});
      log.push({t:'info', msg:`　始点ギャップ: ${stitched.startGap.toFixed(0)}m / 終点ギャップ: ${stitched.endGap.toFixed(0)}m`});
      log.push({t:'info', msg:`　抽出区間の経路長: ${(stitched.routeLen/1000).toFixed(1)}km（駅間直線距離: ${(stitched.directLen/1000).toFixed(1)}km）`});
    }
  }

  // --- 戦略A の結果が不十分なら戦略B ---
  const insufficient = !stitched || stitched.startGap>NEAR_STATION || stitched.endGap>NEAR_STATION || stitched.coords.length<2;
  if(insufficient){
    log.push({t:'warn', msg:`戦略Aの結果が不十分（端点が駅から離れている）→ 戦略B(エリア検索)を試行`});
    const resB = await strategyByArea(seg, bbox, log);
    if(resB){
      const stB = stitchWays(resB.wayEls, fromCoord, toCoord);
      if(stB){
        log.push({t:'info', msg:`　連結(B): ${stB.usedWays}/${stB.totalWays} wayを使用`});
        log.push({t:'info', msg:`　始点ギャップ(B): ${stB.startGap.toFixed(0)}m / 終点ギャップ(B): ${stB.endGap.toFixed(0)}m`});
        // BがAより良ければB採用
        if(!stitched || (stB.startGap+stB.endGap < stitched.startGap+stitched.endGap)){
          stitched = stB;
          res = resB;
          log.push({t:'ok', msg:`　→ 戦略Bの結果を採用`});
        } else {
          log.push({t:'info', msg:`　→ 戦略Aの方が良好なため戦略A維持`});
        }
      }
    }
  }

  if(!stitched || stitched.coords.length<2){
    log.push({t:'err', msg:'有効な経路を構築できず → fallback採用'});
    return null;
  }

  // 端点情報をログに出力（APIを追加で叩かず座標のみ記録）
  const ep1=stitched.coords[0], ep2=stitched.coords[stitched.coords.length-1];
  log.push({t:'info', msg:`描画線の端点1: [${ep1[0].toFixed(4)}, ${ep1[1].toFixed(4)}]`});
  log.push({t:'info', msg:`描画線の端点2: [${ep2[0].toFixed(4)}, ${ep2[1].toFixed(4)}]`});
  log.push({t:'info', msg:`　端点1→乗車駅距離: ${stitched.startGap.toFixed(0)}m / 端点2→降車駅距離: ${stitched.endGap.toFixed(0)}m`});

  return stitched.coords;
}

// =====================================================================
// 地図・描画
// =====================================================================
function initMapAndUI(){
  map = L.map('map').setView([35.0,134.5], 5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom:19
  }).addTo(map);
  buildPanel();
  buildLegend();
  loadAll();
}

function makePl(coords, seg){
  const t=T[seg.type];
  const pl=L.polyline(coords,{color:t.color,weight:t.w,dashArray:t.dash,opacity:0.85});
  pl._baseW=t.w; pl._active=false;
  pl.bindTooltip(`<b>${seg.name}</b><br>${seg.from} <b>${seg.dep}</b> → ${seg.to} <b>${seg.arr}</b><br><span style="color:#666">${seg.note}</span>`,{sticky:true,direction:'top'});
  pl.on('mouseover',function(){if(!this._active)this.setStyle({weight:this._baseW+2,opacity:1});});
  pl.on('mouseout',function(){if(!this._active)this.setStyle({weight:this._baseW,opacity:0.85});});
  pl.on('click',()=>selectSeg(seg.di,seg.si));
  return pl;
}
function putFallback(seg){
  if(!seg.fallback?.length) return;
  const key=`${seg.di}-${seg.si}`;
  if(plMap[key]?.osm||plMap[key]?.fallback) return;
  const pl=makePl(seg.fallback,seg); pl.addTo(map);
  plMap[key]={fallback:pl};
}
function putOsm(seg,coords){
  const key=`${seg.di}-${seg.si}`;
  const e=plMap[key]||{};
  if(e.fallback){map.removeLayer(e.fallback);delete e.fallback;}
  if(e.osm)map.removeLayer(e.osm);
  const pl=makePl(coords,seg); pl.addTo(map);
  plMap[key]={osm:pl};
}
function getActivePl(di,si){ const e=plMap[`${di}-${si}`]; return e?.osm||e?.fallback||null; }

function resetActive(){
  if(activePl){activePl._active=false;activePl.setStyle({weight:activePl._baseW,opacity:0.85});activePl=null;}
  if(activeRow){activeRow.classList.remove('active');activeRow=null;}
}
function selectSeg(di,si){
  resetActive();
  const pl=getActivePl(di,si); if(!pl)return;
  pl._active=true; pl.setStyle({weight:pl._baseW+3,opacity:1}); activePl=pl;
  map.fitBounds(pl.getBounds(),{padding:[50,50]});
  const row=document.getElementById(`r-${di}-${si}`);
  if(row){row.classList.add('active');row.scrollIntoView({block:'nearest'});activeRow=row;}
  const seg=SEGS.find(s=>s.di===di&&s.si===si);
  if(seg)showDet(seg);
}
function showDet(seg){
  const t=T[seg.type], d=seg.detail||{};
  document.getElementById('det-title').textContent=seg.name;
  const body=document.getElementById('det-body'); body.innerHTML='';
  const badge=document.createElement('div'); badge.className='det-badge';
  badge.style.cssText=`background:${t.color}22;color:${t.color}`; badge.textContent=t.label;
  body.appendChild(badge);
  const route=document.createElement('div'); route.className='det-route';
  const h3=document.createElement('h3'); h3.textContent=`${seg.from} ${seg.dep} → ${seg.to} ${seg.arr}`;
  const p=document.createElement('p'); p.textContent=seg.note;
  route.appendChild(h3); route.appendChild(p); body.appendChild(route);
  [['tip','box-tip'],['warn','box-warn'],['info','box-info']].forEach(([k,cls])=>{
    if(d[k]){const el=document.createElement('div');el.className=cls;el.textContent=d[k];body.appendChild(el);}
  });
  document.getElementById('det').style.display='block';
}
function closeDet(){ document.getElementById('det').style.display='none'; resetActive(); }

function buildPanel(){
  const body=document.getElementById('panel-body');
  let prevDi=-1;
  for(const seg of SEGS){
    if(seg.di!==prevDi){
      const blk=document.createElement('div'); blk.className='day-block'; blk.id=`day-${seg.di}`;
      const dl=document.createElement('div'); dl.className='day-label';
      dl.textContent=DAY_LABELS[seg.di]||`Day ${seg.di+1}`;
      blk.appendChild(dl); body.appendChild(blk); prevDi=seg.di;
    }
    const t=T[seg.type];
    const blk=document.getElementById(`day-${seg.di}`);
    const row=document.createElement('div'); row.className='seg-row'; row.id=`r-${seg.di}-${seg.si}`;
    const nameRow=document.createElement('div'); nameRow.style.cssText='display:flex;align-items:center;';
    const dot=document.createElement('span'); dot.className='seg-dot'; dot.style.background=t.color;
    const nm=document.createElement('span'); nm.className='seg-name'; nm.textContent=seg.name;
    nameRow.appendChild(dot); nameRow.appendChild(nm);
    const tm=document.createElement('div'); tm.className='seg-time';
    tm.innerHTML=`${seg.from} <b>${seg.dep}</b> → ${seg.to} <b>${seg.arr}</b>`;
    const nt=document.createElement('div'); nt.className='seg-note'+(seg.warn?' warn':''); nt.textContent=seg.note;
    const ic=document.createElement('span'); ic.className='seg-icon'; ic.id=`icon-${seg.di}-${seg.si}`;
    ic.textContent=(seg.lineNames||seg.lineName)?'⏳':'';
    ic.title='クリックでログ表示'; ic.onclick=(e)=>{e.stopPropagation();openLog(`${seg.di}-${seg.si}`);};
    row.appendChild(nameRow); row.appendChild(tm); row.appendChild(nt); row.appendChild(ic);
    row.addEventListener('click',()=>selectSeg(seg.di,seg.si));
    blk.appendChild(row);
  }
}
function buildLegend(){
  const lg=document.getElementById('legend');
  for(const [,t] of Object.entries(T)){
    const el=document.createElement('div'); el.className='leg-item';
    const ln=document.createElement('div'); ln.className='leg-line'; ln.style.background=t.color;
    el.appendChild(ln); el.appendChild(document.createTextNode(t.label)); lg.appendChild(el);
  }
}

// =====================================================================
// ログウィンドウ
// =====================================================================
function openLog(focusKey){
  renderLog(focusKey);
  document.getElementById('log-overlay').style.display='block';
}
function closeLog(){ document.getElementById('log-overlay').style.display='none'; }

function renderLog(focusKey){
  const filter=document.getElementById('log-filter').value;
  const body=document.getElementById('log-body'); body.innerHTML='';

  // サマリー
  const keys=Object.keys(LOG);
  const nOk=keys.filter(k=>LOG[k].result==='osm').length;
  const nFb=keys.filter(k=>LOG[k].result==='fallback').length;
  const nErr=keys.filter(k=>LOG[k].result==='error').length;
  const nSkip=keys.filter(k=>LOG[k].result==='skip').length;
  document.getElementById('log-summary').textContent =
    `合計${keys.length}区間 / API成功(OSM描画)${nOk} ・ fallback採用${nFb} ・ エラー${nErr} ・ skip(直線)${nSkip}`;

  for(const seg of SEGS){
    const key=`${seg.di}-${seg.si}`;
    const lg=LOG[key];
    if(!lg) continue;
    if(filter==='ok' && lg.result!=='osm') continue;
    if(filter==='fallback' && lg.result!=='fallback') continue;
    if(filter==='error' && lg.result!=='error') continue;

    const segDiv=document.createElement('div'); segDiv.className='log-seg';
    const head=document.createElement('div');
    const statusClass = lg.result==='osm'?'ok' : lg.result==='error'?'error' : 'fallback';
    head.className='log-seg-head '+statusClass;
    const icon = lg.result==='osm'?'🗺' : lg.result==='error'?'❌' : lg.result==='skip'?'➖':'⚠';
    const total = lg.totalTime!=null ? `${lg.totalTime.toFixed(1)}秒` : '';
    head.innerHTML=`<span class="log-seg-status">${icon}</span><span class="log-seg-name">${seg.name}</span><span class="log-seg-time">${total}</span>`;
    const detail=document.createElement('div'); detail.className='log-detail';
    if(focusKey===key) detail.classList.add('open');
    detail.innerHTML = lg.steps.map(s=>{
      const cls = s.t==='ok'?'log-ok':s.t==='warn'?'log-warn':s.t==='err'?'log-err':'log-step';
      return `<span class="${cls}">${escapeHtml(s.msg)}</span>`;
    }).join('\n');
    head.onclick=()=>detail.classList.toggle('open');
    segDiv.appendChild(head); segDiv.appendChild(detail);
    body.appendChild(segDiv);
    if(focusKey===key) setTimeout(()=>head.scrollIntoView({block:'center'}),50);
  }
}
function escapeHtml(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// =====================================================================
// 全区間ロード（シリアル）
// =====================================================================
let done=0;
async function loadAll(){
  const total=SEGS.length;
  document.getElementById('progress-label').textContent=`0/${total}`;
  for(const seg of SEGS){
    await loadOneSeg(seg);
  }
  document.getElementById('status-text').textContent='✅ 読み込み完了';
  const allPls=Object.values(plMap).map(e=>e.osm||e.fallback).filter(Boolean);
  if(allPls.length>0){ try{ map.fitBounds(L.featureGroup(allPls).getBounds(),{padding:[20,20]}); }catch(e){} }
}

async function loadOneSeg(seg){
  const key=`${seg.di}-${seg.si}`;
  const t0=performance.now();
  const log=[];
  LOG[key]={steps:log, result:null, totalTime:null};

  document.getElementById('status-text').textContent=`取得中: ${seg.name}`;

  // fallback即描画
  putFallback(seg);

  let result='fallback';
  if(seg.fallbackSkip){
    result='skip';
    log.push({t:'info', msg:'種別: fallbackSkip（新幹線/長距離/短距離特殊区間）'});
  } else if(seg.lineNames||seg.lineName){
    const icon=document.getElementById(`icon-${seg.di}-${seg.si}`);
    let coords=null;
    try { coords=await fetchRailCoords(seg, log); } catch(e){ log.push({t:'err',msg:'例外: '+e.message}); }
    if(coords&&coords.length>=2){
      putOsm(seg,coords);
      result='osm';
      log.push({t:'ok', msg:'→ APIの出力を採用して描画'});
      if(icon)icon.textContent='🗺';
    } else {
      result='fallback';
      log.push({t:'warn', msg:'→ fallback（直線/概略）を採用して描画'});
      if(icon)icon.textContent='⚠';
    }
  } else {
    result='skip';
    log.push({t:'info', msg:'路線名指定なし → fallback直線'});
  }

  LOG[key].result = (result==='fallback' && log.some(s=>s.t==='err')) ? 'error' : result;
  if(LOG[key].result==='error') LOG[key].result='fallback'; // エラーでもfallback描画はされている
  // 厳密なerror判定: API試行したが全滅
  if(result==='fallback' && (seg.lineNames||seg.lineName) && log.some(s=>s.msg.includes('データ取得失敗')||s.msg.includes('タイムアウト'))){
    LOG[key].result='error';
  }

  LOG[key].totalTime=(performance.now()-t0)/1000;

  done++;
  const total=SEGS.length;
  document.getElementById('progress-fill').style.width=Math.round(done/total*100)+'%';
  document.getElementById('progress-label').textContent=`${done}/${total}`;
}
