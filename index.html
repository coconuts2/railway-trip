<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鉄道旅行ルートマップ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;}
html,body{overscroll-behavior:none;} /* pull-to-refresh抑止（シート下ドラッグと衝突するため） */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;}
#header{padding:7px 14px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap;}
#header h1{font-size:13px;font-weight:600;color:#222;}
#status-bar{font-size:11px;color:#888;margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
#progress{width:90px;height:5px;background:#eee;border-radius:3px;overflow:hidden;}
#progress-fill{height:100%;background:#534AB7;width:0%;transition:width 0.3s;}
.hbtn{background:#f0f0f0;border:none;border-radius:5px;padding:3px 9px;cursor:pointer;font-size:10px;color:#555;white-space:nowrap;}
.hbtn:hover{background:#e3e3e3;}
#main{display:flex;flex:1;min-height:0;position:relative;}
#map{flex:1;min-width:0;background:#eef0f2;}
#panel{width:280px;min-width:280px;background:#fff;border-left:1px solid #e0e0e0;overflow:hidden;display:flex;flex-direction:column;font-size:12px;position:relative;}
#dot-jump{padding:10px 14px;border-bottom:1px solid #eee;background:#fffdfc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;}
#dot-jump.empty{display:none;}
.dj-head{font-size:11px;font-weight:700;color:#c0392b;margin-bottom:4px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:5px;}
.dj-head:hover{color:#a93226;}
.dj-caret{font-size:9px;flex-shrink:0;}
.dj-list{}
#dot-jump.collapsed .dj-list{display:none;}
.dj-item{display:flex;align-items:center;gap:6px;padding:3px 6px;font-size:11px;border-radius:5px;cursor:pointer;border:1px solid #f0d0c8;background:#fff7f5;margin-bottom:3px;}
.dj-item:hover{background:#ffe9e3;}
.dj-icon{flex-shrink:0;}
.dj-name{flex:1;color:#333;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dj-gap{color:#c0392b;font-size:10px;flex-shrink:0;}
.dj-day{color:#999;font-size:10px;flex-shrink:0;}
.seg-row{padding:5px 30px 5px 16px;cursor:pointer;border-top:1px solid #f0f0f0;position:relative;}
.seg-row:hover{background:#f5f5f0;}
.seg-row.active{background:#eef4ff;outline:2px solid #4477cc;outline-offset:-2px;}
.seg-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle;}
.seg-name{font-weight:600;color:#222;font-size:11px;vertical-align:middle;}
.seg-time{color:#666;font-size:10px;margin-top:1px;}
.seg-note{color:#888;font-size:10px;margin-top:1px;line-height:1.4;}
.warn{color:#c84800;}
.seg-icon{position:absolute;right:6px;top:6px;font-size:10px;line-height:1;cursor:help;}
#det{display:none;position:absolute;right:0;bottom:0;width:280px;height:50%;background:#fff;border-top:2px solid #d0d0d0;border-left:1px solid #e0e0e0;overflow-y:auto;z-index:20;box-shadow:0 -4px 16px rgba(0,0,0,0.13);border-radius:12px 0 0 0;overscroll-behavior:contain;}
#det-head{display:flex;align-items:flex-start;gap:6px;padding:8px 12px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:3;}
#det-title{font-size:11px;font-weight:600;color:#222;flex:1;line-height:1.4;}
#det-close{background:#f0f0f0;border:none;border-radius:5px;padding:2px 7px;cursor:pointer;font-size:11px;color:#555;flex-shrink:0;}
#det-body{padding:11px;}
.det-badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:10px;font-weight:600;margin-bottom:7px;}
.det-route{background:#f8f8f5;border-radius:6px;padding:6px 9px;margin-bottom:7px;}
.det-route h3{font-size:11px;font-weight:600;color:#333;margin-bottom:2px;}
.det-route p{font-size:10px;color:#666;line-height:1.5;}
.box-tip{background:#edf7f2;border-left:3px solid #1a9e75;border-radius:0 5px 5px 0;padding:6px 9px;font-size:11px;line-height:1.6;color:#0a5c3f;margin-bottom:6px;}
.box-warn{background:#fff8ec;border-left:3px solid #e08800;border-radius:0 5px 5px 0;padding:6px 9px;font-size:11px;line-height:1.6;color:#7a4a00;margin-bottom:6px;}
.box-info{background:#eef4ff;border-left:3px solid #4477cc;border-radius:0 5px 5px 0;padding:6px 9px;font-size:11px;line-height:1.6;color:#1a3a7a;margin-bottom:6px;}
#legend{display:flex;flex-wrap:wrap;gap:7px;padding:5px 12px;background:#fff;border-top:1px solid #e0e0e0;font-size:11px;flex-shrink:0;}
.leg-item{display:flex;align-items:center;gap:4px;color:#555;}
.leg-line{width:18px;height:3px;border-radius:2px;}
/* ログウィンドウ */
#log-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:1000;}
#log-win{position:absolute;top:5%;left:50%;transform:translateX(-50%);width:90%;max-width:900px;height:85%;background:#fff;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,0.3);display:flex;flex-direction:column;overflow:hidden;}
#log-head{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid #e0e0e0;background:#fafafa;}
#log-head h2{font-size:14px;font-weight:600;color:#222;flex:1;}
#log-filter{font-size:11px;padding:3px 6px;border:1px solid #ccc;border-radius:4px;margin-right:8px;}
#log-body{flex:1;overflow-y:auto;padding:0;font-family:'SF Mono',Consolas,'Courier New',monospace;font-size:11px;}
.log-seg{border-bottom:1px solid #eee;}
.log-seg-head{padding:7px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;background:#fff;}
.log-seg-head:hover{background:#f5f5f5;}
.log-seg-head.ok{border-left:3px solid #1a9e75;}
.log-seg-head.fallback{border-left:3px solid #e08800;}
.log-seg-head.error{border-left:3px solid #d04545;}
.log-seg-status{font-size:13px;}
.log-seg-name{font-weight:600;color:#333;flex:1;font-family:-apple-system,sans-serif;}
.log-seg-time{color:#999;font-size:10px;}
.log-detail{display:none;padding:8px 14px 12px 28px;background:#fafafa;color:#444;line-height:1.7;white-space:pre-wrap;}
.log-detail.open{display:block;}
.log-step{color:#666;}
.log-step b{color:#222;}
.log-ok{color:#1a7d56;}
.log-warn{color:#c47800;}
.log-err{color:#c03030;}
#log-summary{padding:8px 14px;background:#f0f4ff;border-bottom:1px solid #dde;font-family:-apple-system,sans-serif;font-size:12px;color:#334;}
/* ファイル読込画面 */
#loader-screen{position:fixed;inset:0;background:#f5f6f8;z-index:2000;display:flex;align-items:center;justify-content:center;}
#loader-box{background:#fff;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,0.1);padding:32px 40px;max-width:480px;text-align:center;}
#loader-box h1{font-size:18px;color:#222;margin-bottom:8px;}
#loader-box p{font-size:13px;color:#777;line-height:1.7;margin-bottom:20px;}
#drop-zone{border:2px dashed #ccc;border-radius:10px;padding:30px 20px;cursor:pointer;transition:all 0.2s;margin-bottom:14px;}
#drop-zone:hover,#drop-zone.dragover{border-color:#534AB7;background:#f8f7ff;}
#drop-zone .icon{font-size:36px;margin-bottom:8px;}
#drop-zone .txt{font-size:13px;color:#555;}
#drop-zone .sub{font-size:11px;color:#aaa;margin-top:4px;}
.loader-btn{background:#534AB7;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:13px;cursor:pointer;margin:4px;}
.loader-btn:hover{background:#433a9e;}
.loader-btn.alt{background:#eee;color:#555;}
.loader-btn.alt:hover{background:#e0e0e0;}
#loader-err{color:#c03030;font-size:12px;margin-top:10px;min-height:16px;}
/* ===== 行程表（カレンダー）===== */
#cal-head{flex-shrink:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;padding:8px 12px;background:#fff;border-bottom:1px solid #e0e0e0;}
#cal-title{font-size:12px;font-weight:700;color:#534AB7;}
#cal-head-ctrls{display:flex;flex-wrap:wrap;gap:4px 12px;margin-left:auto;}
#cal-head-ctrls label{display:flex;align-items:center;gap:5px;font-size:11px;color:#555;cursor:pointer;}
#cal-head-ctrls input{cursor:pointer;margin:0;}
#ph-dotonly{color:#c0392b;font-weight:600;}
#calendar-body{padding:10px 12px 28px;background:#fafafa;flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
.cal-day{margin-bottom:18px;}
.cal-day-head{background:#eef4ee;border-radius:7px;padding:7px 10px;margin-bottom:11px;}
.cal-day-top{display:flex;align-items:center;gap:7px;}
.cal-day-chk{cursor:pointer;margin:0;flex-shrink:0;accent-color:#2e5d3e;}
.cal-day-title{font-size:11px;font-weight:700;color:#2e5d3e;cursor:pointer;}
.cal-day-route{font-size:10px;color:#5a7a64;margin-top:3px;line-height:1.5;word-break:break-all;}
.cal-tl{position:relative;margin-left:6px;padding-left:18px;border-left:2px solid #d8d8dc;}
.cal-node{position:relative;padding:2px 0 2px 4px;min-height:18px;}
.cal-node-dot{position:absolute;left:-25px;top:4px;width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid #b2b2ba;box-sizing:border-box;z-index:2;}
.cal-node.start .cal-node-dot{background:#222;border-color:#222;}
.cal-node.stay .cal-node-dot{background:#16a34a;border-color:#0f7a37;}
.cal-node-line{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 6px;}
.cal-node-line + .cal-node-line{margin-top:1px;}
.cal-node-tw{display:inline-flex;align-items:baseline;gap:2px;flex-shrink:0;}
.cal-node-time{font-size:11px;font-weight:700;color:#444;font-family:'SF Mono',Consolas,monospace;}
.cal-node-suffix{font-size:9px;color:#999;}
.cal-node-name{font-size:12px;font-weight:600;color:#1a1a1a;}
.cal-node-tag{font-size:10px;color:#0f7a37;font-weight:600;}
.cal-node.start .cal-node-tag{color:#333;}
.cal-edge{position:relative;margin:2px 0 2px -2px;padding:3px 9px;border-radius:5px;cursor:pointer;border-left:4px solid #999;background:#f2f2f4;transition:filter .12s;display:flex;flex-direction:column;justify-content:center;}
.cal-edge:hover{filter:brightness(0.96);}
.cal-edge-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:1px 7px;}
.cal-edge-name{font-size:11px;font-weight:700;line-height:1.35;}
.cal-edge-dur{font-size:9px;color:#888;font-weight:normal;flex-shrink:0;white-space:nowrap;}
.cal-edge-note{font-size:10px;margin-top:2px;line-height:1.4;color:#c0392b;font-weight:600;}
/* ===== パネル幅リサイザ（PC/タブレット。地図との境界をドラッグ） ===== */
#panel-resizer{width:6px;flex-shrink:0;cursor:col-resize;background:transparent;z-index:5;}
#panel-resizer:hover,body.col-resizing #panel-resizer{background:#d8d6f0;}
body.col-resizing{user-select:none;cursor:col-resize;}
@media (max-width:768px){#panel-resizer{display:none;}}
/* ===== 表示切替（リスト⇄タイム） ===== */
#view-toggle{display:flex;flex-shrink:0;}
.vt{border:1px solid #d6d6de;background:#fff;font-size:10px;padding:3px 8px;cursor:pointer;color:#666;line-height:1;}
.vt:first-child{border-radius:6px 0 0 6px;}
.vt:last-child{border-radius:0 6px 6px 0;margin-left:-1px;}
.vt.on{background:#534AB7;border-color:#534AB7;color:#fff;}
#tg-zoom{display:none;flex-shrink:0;}
#tg-zoom .vt{min-width:26px;padding:3px 6px;}
/* ===== タイム表示（Googleカレンダー風 0:00-24:00 縦グリッド。1時間=var(--tg-hour)（JSのTG_HOURが設定・ズーム可変）、日ヘッダ=30px ===== */
#calendar-body.time-mode{padding:0;background:#fff;}
.tg-scroll{display:flex;min-width:max-content;}
.tg-axis{position:sticky;left:0;z-index:5;width:36px;flex-shrink:0;background:#fff;border-right:1px solid #e2e2ea;}
.tg-corner{position:sticky;top:0;z-index:6;height:30px;background:#fff;border-bottom:1px solid #dfe0e8;}
.tg-hour{height:var(--tg-hour,44px);font-size:9px;color:#98a;text-align:right;padding-right:5px;transform:translateY(-6px);}
.tg-day{width:150px;flex-shrink:0;border-right:1px solid #ececf2;}
.tg-day-head{position:sticky;top:0;z-index:4;height:30px;display:flex;align-items:center;gap:5px;padding:0 7px;background:#eef4ee;border-bottom:1px solid #dfe6df;font-size:10px;font-weight:700;color:#2e5d3e;white-space:nowrap;overflow:hidden;}
.tg-day-head input{margin:0;flex-shrink:0;accent-color:#2e5d3e;cursor:pointer;}
.tg-day-head span{cursor:pointer;overflow:hidden;text-overflow:ellipsis;}
.tg-col{position:relative;height:calc(var(--tg-hour,44px)*24);background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--tg-hour,44px) - 1px),#eef0f4 calc(var(--tg-hour,44px) - 1px),#eef0f4 var(--tg-hour,44px));}
.tg-block{position:absolute;border-left:3px solid #9e9e9e;border-radius:4px;padding:2px 4px;font-size:9px;overflow:hidden;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.05);}
.tg-block .tb-time{font-size:8px;color:#66708a;line-height:1.2;white-space:nowrap;}
.tg-block .tb-name{font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.tg-block.tiny{padding:0 4px;display:flex;align-items:center;}
.tg-block.tiny .tb-time{display:none;}
.tg-block.tiny .tb-name{-webkit-line-clamp:1;font-size:8px;}
.tg-block.active{outline:2px solid #4477cc;outline-offset:-1px;z-index:3;}
@media (hover:hover){.tg-block:hover{filter:brightness(0.97);}}
/* ===== モバイル共通（タップしやすい余白・フォント） ===== */
@media (max-width:768px){
  .seg-row{padding-top:8px;padding-bottom:8px;}
  .dj-item{padding:6px 8px;}
  #det-close{padding:5px 12px;font-size:13px;}
  .leg-item{font-size:12px;}
}
/* ===== スマホ横画面：縦積み+vh固定をやめ、左右分割のまま各部を圧縮（崩れ解消） ===== */
@media (max-width:1024px) and (orientation:landscape) and (max-height:520px){
  #header{padding:4px 10px;gap:6px;}
  #header h1{font-size:12px;}
  .hbtn{padding:2px 7px;}
  #panel{width:min(300px,42vw);min-width:230px;}
  #det{width:min(340px,55vw);height:100%;border-radius:12px 0 0 0;}
}
/* タッチ端末でホバー前提のUIが固まらないように */
@media (hover:none){
  .seg-row:active{background:#eef3ff;}
  .dj-item:active{background:#ffe9e3;}
}
/* 行程表シートのつまみ（既定は非表示・スマホ縦画面のみ表示） */
#sheet-handle{display:none;align-items:center;justify-content:center;height:22px;flex-shrink:0;cursor:grab;background:#fff;border-radius:18px 18px 0 0;touch-action:none;}
#sheet-handle:active{cursor:grabbing;}
.sheet-grip{width:38px;height:5px;border-radius:3px;background:#c8c8d0;transition:background .15s;}
#sheet-handle:active .sheet-grip{background:#9a9aa5;}
/* ===== スマホ縦画面：行程表を下からのスライドシート化 ===== */
@media (max-width:768px) and (orientation:portrait){
  #main{position:relative;}
  #map{position:absolute;inset:0;width:auto;height:auto;flex:none;z-index:0;}
  #panel{
    position:absolute;left:0;right:0;bottom:0;width:100%;min-width:0;
    height:var(--sheet-h,230px);max-height:100dvh;
    border-left:none;border-top:none;border-radius:18px 18px 0 0;
    box-shadow:0 -6px 22px rgba(0,0,0,0.16);
    transition:height .3s cubic-bezier(.32,.72,0,1);
    z-index:30;overflow:hidden;display:flex;flex-direction:column;
  }
  #panel.dragging{transition:none;}
  #sheet-handle{display:flex;}
  #cal-head{touch-action:none;} /* 見出しもドラッグ面（クリックは通常通り機能） */
  /* 詳細パネルもシートに合わせて下部の大きめオーバーレイに */
  #det{width:100%;height:70dvh;right:0;bottom:0;border-radius:18px 18px 0 0;z-index:40;}
}
</style>
</head>
<body>

<!-- ファイル読込画面 -->
<div id="loader-screen">
  <div id="loader-box">
    <h1>🚄 鉄道旅行ルートマップ</h1>
    <p>旅程データ（itinerary.json）を読み込んでください。<br>地図上にルートを描画します。</p>
    <div id="drop-zone">
      <div class="icon">📁</div>
      <div class="txt">クリックして選択 / ドラッグ&ドロップ</div>
      <div class="sub">itinerary.json</div>
    </div>
    <input type="file" id="file-input" accept=".json,application/json" style="display:none">
    <div>
      <button class="loader-btn alt" onclick="tryAutoLoad()">同じ階層の itinerary.json を自動読込</button>
    </div>
    <div id="loader-opts" style="margin-top:14px;text-align:left;font-size:13px;line-height:1.95;">
      <label style="display:block;cursor:pointer;"><input type="checkbox" id="opt-stratb" checked style="vertical-align:middle;margin-right:6px;">戦略B（エリア検索のフォールバック）を使う</label>
      <label style="display:block;cursor:pointer;"><input type="checkbox" id="opt-kumi" style="vertical-align:middle;margin-right:6px;">kumiサーバをフェイルオーバーに使う（不安定なため既定OFF）</label>
      <label style="display:block;cursor:pointer;"><input type="checkbox" id="opt-fullcache" style="vertical-align:middle;margin-right:6px;">長期路線も完全保存（間引きしない・キャッシュ容量大／ダウンロード用）</label>
      <label style="display:block;cursor:pointer;"><input type="checkbox" id="opt-memcache" style="vertical-align:middle;margin-right:6px;">メモリキャッシュを使う（容量無制限・全件保存／要ダウンロード・リロードで消える）</label>
    </div>
    <div id="cache-io" style="margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
      <button class="loader-btn alt" onclick="downloadCache()" style="font-size:12px;padding:6px 12px;">💾 キャッシュをダウンロード</button>
      <button class="loader-btn alt" onclick="document.getElementById('cache-file-input').click()" style="font-size:12px;padding:6px 12px;">📤 キャッシュを復元（アップロード）</button>
      <input type="file" id="cache-file-input" accept=".json,application/json" style="display:none" onchange="if(this.files[0]){uploadCache(this.files[0]); this.value='';}">
    </div>
    <div id="cache-io-msg" style="margin-top:6px;font-size:11px;color:#555;min-height:14px;"></div>
    <div id="loader-err"></div>
  </div>
</div>

<div id="app" style="display:none;">
<div id="header">
  <h1 id="trip-title">🚄 鉄道旅行ルートマップ</h1>
  <div id="status-bar">
    <span id="status-text">準備中...</span>
    <div id="progress"><div id="progress-fill"></div></div>
    <span id="progress-label">0/0</span>
    <button class="hbtn" onclick="openLog()">📋 ログ</button>
    <button class="hbtn" onclick="downloadCache()">💾 キャッシュ保存</button>
    <button class="hbtn" onclick="clearCache()">🗑 キャッシュ削除</button>
    <button class="hbtn" onclick="reload()">📁 別データ</button>
  </div>
</div>
<div id="main">
  <div id="map"></div>
  <div id="panel-resizer"></div>
  <div id="panel">
    <div id="sheet-handle"><div class="sheet-grip"></div></div>
    <div id="cal-head">
      <span id="cal-title">📅 行程表</span>
      <div id="view-toggle"><button class="vt on" id="vt-list" onclick="setCalMode('list')">📋 リスト</button><button class="vt" id="vt-time" onclick="setCalMode('time')">🕐 タイム</button></div>
      <div id="tg-zoom"><button class="vt" onclick="tgZoom(0.8)" title="時間軸を縮小">－</button><button class="vt" onclick="tgZoom(1.25)" title="時間軸を拡大">＋</button></div>
      <div id="cal-head-ctrls">
        <label id="ph-all"><input type="checkbox" id="chk-all-days" checked onchange="toggleAllDays(this.checked)">全日表示</label>
        <label id="ph-dotonly"><input type="checkbox" id="chk-dot-only" onchange="toggleDotOnly(this.checked)">未達/直線のみ</label>
      </div>
    </div>
    <div id="calendar-body"></div>
  </div>
  <div id="det">
    <div id="det-head"><span id="det-title"></span><button id="det-close" onclick="closeDet()">✕ 閉じる</button></div>
    <div id="det-body"></div>
  </div>
</div>
<div id="legend"></div>
</div>

// =====================================================================
// localStorageキャッシュ
// =====================================================================
// ---- 容量超過時の自動退避: 旧クエリキャッシュ(osm_)を大きい順に追い出して書込を通す ----
//  prefixOrder の先頭ファミリーから、サイズ降順で1件ずつ削除→再試行。
//  ※"osmrel_"/"osmseg_" は "osm_" にprefix一致しない（4文字目が_でない）ので誤爆しない。
let EVICTED = 0; // 今回セッションの退避件数（統計表示用）
// 「いずれかの区間で採用中(osmseg_に記載)のrelation」キー集合。退避時の保護対象（遅延構築・segRelsSetで追記）。
let PROTECTED_RELS = null;
function protectedRelKeys(){
  if(PROTECTED_RELS) return PROTECTED_RELS;
  PROTECTED_RELS = new Set();
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(!k.startsWith('osmseg_')) continue;
    try{ const {rels}=JSON.parse(localStorage.getItem(k)||'{}'); (rels||[]).forEach(id=>PROTECTED_RELS.add('osmrel_'+id)); }catch(e){}
  }
  return PROTECTED_RELS;
}
function evictForSpace(prefixOrder, excludeKey){
  const prot = protectedRelKeys();
  const cands=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k===excludeKey) continue;
    const pri=prefixOrder.findIndex(p=>k.startsWith(p));
    if(pri<0) continue;
    cands.push({k, pri, prot: prot.has(k)?1:0, size:(localStorage.getItem(k)||'').length});
  }
  if(!cands.length) return false;
  // 非保護を優先して追い出す → ファミリー優先順 → サイズ大きい順。
  // 保護分しか残っていない場合は保護分も対象（新規書込不能よりはマシ）。
  cands.sort((a,b)=> a.prot-b.prot || a.pri-b.pri || b.size-a.size);
  localStorage.removeItem(cands[0].k);
  EVICTED++;
  return true;
}
function lsSetSmart(key, val, prefixOrder){
  for(let t=0;t<10;t++){
    try { localStorage.setItem(key, val); return true; }
    catch(e){ if(!evictForSpace(prefixOrder, key)) return false; }
  }
  return false;
}
// ---- キャッシュ抽象化: USE_MEM_CACHE時はメモリ(MEM_CACHE)を使い、通常はlocalStorage ----
// メモリモードは容量無制限(RAM)・退避なし。読みはメモリ優先→localStorageフォールバック。
function cacheRead(key){
  if(USE_MEM_CACHE && Object.prototype.hasOwnProperty.call(MEM_CACHE, key)) return MEM_CACHE[key];
  return localStorage.getItem(key);
}
function cacheWrite(key, val, prefixOrder){
  if(USE_MEM_CACHE){ MEM_CACHE[key] = val; return true; }   // 容量無制限・退避不要
  return lsSetSmart(key, val, prefixOrder);
}
function cacheRemove(key){
  if(USE_MEM_CACHE) delete MEM_CACHE[key];
  try{ localStorage.removeItem(key); }catch(e){}
}
// 合計処理時間: 各区間のtotalTime合計と、ロード全体の実時間（壁時計）の両方を出す。
//  各区間のtotalTimeはシリアル実行の区間内実時間で重複・漏れなし。合計＝総処理時間。
let WALL_START=null, WALL_END=null;
function totalTimeStr(){
  const keys=Object.keys(LOG);
  const sum=keys.reduce((a,k)=>a+(LOG[k].totalTime||0),0);
  let s=`合計処理時間 ${sum.toFixed(1)}秒（${keys.length}区間）`;
  if(WALL_START!=null){
    const wall=((WALL_END!=null?WALL_END:performance.now())-WALL_START)/1000;
    s+=` / 実時間 ${wall.toFixed(1)}秒`;
  }
  return s;
}

function cacheStats(){
  let q={n:0,c:0}, r={n:0,c:0}, g={n:0,c:0}, w={n:0,c:0};
  const tally=(k,v)=>{
    if(k.startsWith('osmrel_')){r.n++;r.c+=v.length;}
    else if(k.startsWith('osmseg_')){g.n++;g.c+=v.length;}
    else if(k.startsWith('osmway_')){w.n++;w.c+=v.length;}
    else if(k.startsWith('osm_')){q.n++;q.c+=v.length;}
  };
  if(USE_MEM_CACHE){
    for(const k of Object.keys(MEM_CACHE)) tally(k, MEM_CACHE[k]||'');
  } else {
    for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); tally(k, localStorage.getItem(k)||''); }
  }
  const mb=x=>(x*2/1048576).toFixed(2); // JS文字列はUTF-16≒2byte/char換算
  const src=USE_MEM_CACHE?'[メモリ]':'';
  return `キャッシュ統計${src}: クエリosm_ ${q.n}件 ${mb(q.c)}MB ／ relation osmrel_ ${r.n}件 ${mb(r.c)}MB ／ way直接osmway_ ${w.n}件 ${mb(w.c)}MB ／ 採用リストosmseg_ ${g.n}件 ${mb(g.c)}MB ／ 今回退避 ${EVICTED}件`;
}
function cacheKey(q){ return "osm_" + btoa(unescape(encodeURIComponent(q))); }
function cacheGet(q){
  try {
    const raw = cacheRead(cacheKey(q));
    if (!raw) return null;
    const {ts,data} = JSON.parse(raw);
    if (Date.now()-ts > CACHE_TTL){ cacheRemove(cacheKey(q)); return null; }
    return data;
  } catch(e){ return null; }
}
function cacheSet(q,data){
  try { cacheWrite(cacheKey(q), JSON.stringify({ts:Date.now(),data}), ["osm_"]); } catch(e){}
}
// ---- relation単位ジオメトリのキャッシュ（採用relationのみ保存・slim形式で容量節約） ----
function relCacheKey(relId){ return "osmrel_"+relId; }
// allowPartial=true: 間引き保存(p:1)エントリも返す（キャッシュ専用高速パス用）。
// 既定false: 完全版のみ。通常Step2は全way（分岐含む）が必要なため、部分キャッシュはミス扱い→API取得。
function relCacheGet(relId, allowPartial=false){
  try {
    const raw = cacheRead(relCacheKey(relId));
    if(!raw) return null;
    const obj = JSON.parse(raw);
    if(Date.now()-obj.ts > CACHE_TTL){ cacheRemove(relCacheKey(relId)); return null; }
    if(obj.p && !allowPartial) return null;
    return obj.ways;
  } catch(e){ return null; }
}
// relationキャッシュが間引き保存(p:1)かどうか（完全版なら false、未保持も false）。
function relCacheIsPartial(relId){
  try {
    const raw = cacheRead(relCacheKey(relId));
    if(!raw) return false;
    const obj = JSON.parse(raw);
    if(Date.now()-obj.ts > CACHE_TTL) return false;
    return !!obj.p;
  } catch(e){ return false; }
}

// 戦略C（フェリー/ケーブル/索道）専用 way直接キャッシュ。
//  これらは単独way主体でrelation idを持たないことが多く、relcache(osmrel_)に乗らない。
//  またosm_クエリキャッシュは容量退避で消えやすい。そこで区間署名(lineNames+発着+wayQuery)を
//  キーに、取得wayのslim版を専用名前空間(osmway_)へ保存する。osmway_はlsSetSmartの退避対象に
//  含めない（=osm_/osmrel_を先に退避）ので残りやすい。
function wayCacheKey(seg){
  const lns=(seg.lineNames||(seg.lineName?[seg.lineName]:[])).join('|');
  const dep=seg.fallback?.[0]||[], arr=seg.fallback?.[seg.fallback.length-1]||[];
  const wq=(Array.isArray(seg.wayQuery)?seg.wayQuery.join(','):(seg.wayQuery||resolveWayQuery(seg).join(',')));
  const sig=lns+'@'+dep.join(',')+'>'+arr.join(',')+'#'+wq;
  return "osmway_"+btoa(unescape(encodeURIComponent(sig)));
}
function wayCacheGet(seg){
  try{
    const raw=cacheRead(wayCacheKey(seg));
    if(!raw) return null;
    const obj=JSON.parse(raw);
    if(Date.now()-obj.ts>CACHE_TTL){ cacheRemove(wayCacheKey(seg)); return null; }
    return obj.ways; // [{id, geometry:[{lat,lon}], name}]
  }catch(e){ return null; }
}
function wayCacheSet(seg, wayEls){
  try{
    const slim=wayEls.map(w=>({id:w.id, name:(w.tags&&w.tags.name)||null,
      geometry:w.geometry.map(g=>({lat:+(+g.lat).toFixed(5), lon:+(+g.lon).toFixed(5)}))}));
    cacheWrite(wayCacheKey(seg), JSON.stringify({ts:Date.now(), ways:slim}), ["osm_","osmrel_"]);
  }catch(e){}
}
// usedWayIdSet: 採用経路で実際に使ったwayのidセット。
// way数>LARGE_REL_WAYS のrelationは該当wayだけを間引き保存(p:1)し、既存の間引きエントリとway id単位でマージ蓄積
// （同一relationを複数区間で使うケースで、各区間の採用分が積み上がる）。
// 返り値: {ok, saved, total, partial}（ログ表示用）
function relCacheSet(relId, ways, usedWayIdSet){
  try {
    let target = ways, partial = false;
    if(!FULL_CACHE && !USE_MEM_CACHE && ways.length > LARGE_REL_WAYS && usedWayIdSet && usedWayIdSet.size){
      const picked = ways.filter(w=>usedWayIdSet.has(w.id));
      if(picked.length){
        try{
          const prevRaw = cacheRead(relCacheKey(relId));
          if(prevRaw){
            const prev = JSON.parse(prevRaw);
            if(prev.p && Array.isArray(prev.ways)){
              const have = new Set(picked.map(w=>w.id));
              for(const w of prev.ways){ if(!have.has(w.id)) picked.push(w); }
            }
          }
        }catch(e){}
        target = picked; partial = true;
      }
    }
    // タグ等を捨て、座標は5桁丸め（≒1.1m）で容量節約。nodeKeyはtoFixed(5)なのでトポロジー不変。
    const slim = target.map(w=>({id:w.id, geometry:w.geometry.map(g=>({lat:+(+g.lat).toFixed(5), lon:+(+g.lon).toFixed(5)}))}));
    const obj = {ts:Date.now(), ways:slim};
    if(partial) obj.p = 1;
    const ok = cacheWrite(relCacheKey(relId), JSON.stringify(obj), ["osm_","osmrel_"]);
    return {ok, saved:slim.length, total:ways.length, partial};
  } catch(e){ return {ok:false, saved:0, total:(ways&&ways.length)||0, partial:false}; }
}
// ---- 区間ごとの「採用relation IDリスト」キャッシュ（高速パス用） ----
function segRelsKey(seg){
  const lns = (seg.lineNames||(seg.lineName?[seg.lineName]:[])).join('|');
  const dep = seg.fallback?.[0]||[], arr = seg.fallback?.[seg.fallback.length-1]||[];
  const via = (seg.via||[]).map(v=>Array.isArray(v)?v.join(','):String(v)).join('|');
  const sig = lns+'@'+dep.join(',')+'>'+arr.join(',')+(via?('#'+via):'');   // lineNames・発着座標・viaが変われば自動失効
  return "osmseg_"+btoa(unescape(encodeURIComponent(sig)));
}
function segRelsGet(seg){
  try {
    const raw = cacheRead(segRelsKey(seg));
    if(!raw) return null;
    const {ts,rels} = JSON.parse(raw);
    if(Date.now()-ts > CACHE_TTL){ cacheRemove(segRelsKey(seg)); return null; }
    return rels;
  } catch(e){ return null; }
}
function segRelsSet(seg, rels){
  try {
    cacheWrite(segRelsKey(seg), JSON.stringify({ts:Date.now(), rels}), ["osm_","osmrel_"]);
    if(PROTECTED_RELS) rels.forEach(id=>PROTECTED_RELS.add('osmrel_'+id)); // 退避保護リストへ追記
  } catch(e){}
}
function clearCache(){
  const lsKeys = Object.keys(localStorage).filter(k=>/^osm(_|rel_|seg_|way_)/.test(k));
  const memKeys = Object.keys(MEM_CACHE).filter(k=>/^osm(_|rel_|seg_|way_)/.test(k));
  const totalKeys = new Set([...lsKeys, ...memKeys]).size;
  if(totalKeys===0){ alert('削除するキャッシュはありません。'); return; }
  // 容量の概算（文字数ベース）
  let bytes=0; for(const k of lsKeys){ const v=localStorage.getItem(k)||''; bytes+=k.length+v.length; }
  for(const k of memKeys){ bytes+=k.length+(MEM_CACHE[k]||'').length; }
  const mb=(bytes/1048576).toFixed(2);
  const memNote = memKeys.length ? `（うちメモリ${memKeys.length}件）` : '';
  if(!confirm(`キャッシュ ${totalKeys}件${memNote}（約${mb}MB）を削除します。\n次回読込時は全区間をOverpassから再取得するため時間がかかります。\n\n削除してよろしいですか？`)) return;
  lsKeys.forEach(k=>localStorage.removeItem(k));
  memKeys.forEach(k=>{ delete MEM_CACHE[k]; });
  alert(`キャッシュを${totalKeys}件削除しました。リロードで再取得します。`);
}

// キャッシュ(osm*)をJSONファイルにエクスポート（ダウンロード）。メモリとlocalStorage両方を統合。
function downloadCache(){
  const setMsg=(t,err)=>{ const el=document.getElementById('cache-io-msg'); if(el){ el.textContent=t; el.style.color=err?'#c0392b':'#2e7d32'; } };
  const isOsm=k=>/^osm(_|rel_|seg_|way_)/.test(k);
  // localStorage → メモリの順でマージ（メモリ優先＝最新）
  const all={};
  for(const k of Object.keys(localStorage)) if(isOsm(k)){ const v=localStorage.getItem(k); if(v!=null) all[k]=v; }
  for(const k of Object.keys(MEM_CACHE)) if(isOsm(k)) all[k]=MEM_CACHE[k];
  const ks=Object.keys(all);
  if(ks.length===0){ setMsg('保存するキャッシュがありません。', true); alert('保存するキャッシュがありません。'); return; }
  const obj = {__cache_format:'rail_trip_map', version:1, ts:Date.now(), count:ks.length, data:all};
  let bytes=0; for(const k of ks) bytes+=k.length+all[k].length;
  try{
    const blob = new Blob([JSON.stringify(obj)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date(), z=n=>('0'+n).slice(-2);
    a.href = url; a.download = `rail_cache_${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
    setMsg(`キャッシュ ${ks.length}件（約${(bytes/1048576).toFixed(2)}MB）をダウンロードしました。`, false);
  }catch(e){ setMsg('ダウンロード失敗: '+e.message, true); }
}

// JSONファイルからキャッシュ(osm*)を復元。メモリキャッシュ使用時はメモリへ、通常はlocalStorageへ。
function uploadCache(file){
  const setMsg=(t,err)=>{ const el=document.getElementById('cache-io-msg'); if(el){ el.textContent=t; el.style.color=err?'#c0392b':'#2e7d32'; } };
  // 復元時点のチェックボックス状態で保存先を決定（startApp前でも正しく判定）
  const toMem = document.getElementById('opt-memcache')?.checked || false;
  const reader = new FileReader();
  reader.onload = e => {
    let obj;
    try { obj = JSON.parse(e.target.result); }
    catch(err){ setMsg('読み込み失敗: JSONとして解析できません。', true); return; }
    const data = (obj && obj.data && typeof obj.data==='object') ? obj.data : obj;   // ラッパー形式/生形式の両対応
    if(!data || typeof data!=='object'){ setMsg('このファイルはキャッシュ形式ではありません。', true); return; }
    const keys = Object.keys(data).filter(k=>/^osm(_|rel_|seg_|way_)/.test(k));
    if(keys.length===0){ setMsg('キャッシュキー(osm*)が見つかりません。', true); return; }
    const dest = toMem ? 'メモリ' : 'localStorage';
    if(!confirm(`キャッシュ ${keys.length}件を${dest}に復元します。\n同名キーは上書きされます。よろしいですか？`)){ setMsg('復元をキャンセルしました。', true); return; }
    if(toMem){
      // メモリへ（容量無制限・上書き）。USE_MEM_CACHEも有効化して整合させる。
      USE_MEM_CACHE = true;
      for(const k of keys) MEM_CACHE[k] = String(data[k]);
      setMsg(`キャッシュ ${keys.length}件をメモリに復元しました（メモリモードON）。続けてitinerary.jsonを読み込めば再取得を省けます。`, false);
    } else {
      let ok=0, fail=0;
      for(const k of keys){ try{ localStorage.setItem(k, String(data[k])); ok++; }catch(err){ fail++; } }   // 容量超過(QuotaExceeded)等
      if(fail>0) setMsg(`復元: ${ok}件成功 / ${fail}件失敗（localStorage容量超過。メモリキャッシュをONにすると全件復元できます）。`, true);
      else setMsg(`キャッシュ ${ok}件をlocalStorageに復元しました。続けてitinerary.jsonを読み込めば再取得を省けます。`, false);
    }
  };
  reader.onerror = ()=> setMsg('ファイル読み込みエラー。', true);
  reader.readAsText(file);
}

// =====================================================================
// Overpass
// =====================================================================
let lastReq = 0;
const sleep = ms => new Promise(r=>setTimeout(r,ms));

async function fetchOverpass(query, logArr, opts={}) {
  // クライアント側タイムアウト: クエリの[timeout:N]＋5秒（サーバの完走を待ってから諦める）
  const tmm = query.match(/\[timeout:(\d+)\]/);
  const clientTimeout = (tmm ? (+tmm[1])*1000 : FETCH_TIMEOUT) + 5000;
  if (!opts.noCache) {
    const cached = cacheGet(query);
    if (cached) { logArr && logArr.push({t:'cache', msg:'キャッシュHIT'}); return {data:cached, cached:true}; }
  }
  const activeEndpoints = ENDPOINTS.filter(ep => USE_KUMI || !ep.includes('kumi.systems'));

  for (let attempt=0; attempt<MAX_RETRY; attempt++){
    let retryable = false;  // 429/5xx/タイムアウト/ネットワークエラーは一時的とみなし再試行
    for (const ep of activeEndpoints){
      const host = ep.split('/')[2];
      const wait = REQUEST_INTERVAL - (Date.now()-lastReq);
      if (wait > 0) await sleep(wait);
      try {
        lastReq = Date.now();
        const ctrl = new AbortController();
        const timer = setTimeout(()=>ctrl.abort(), clientTimeout);
        const res = await fetch(ep, {
          method:"POST",
          headers:{"Content-Type":"application/x-www-form-urlencoded"},
          body:"data="+encodeURIComponent(query),
          signal:ctrl.signal,
        });
        clearTimeout(timer);
        if (res.status === 429){
          logArr && logArr.push({t:'warn', msg:`${host} → 429（混雑）→ 別サーバへ切替`});
          retryable = true;
          continue; // 次のサーバへフェイルオーバー
        }
        if (!res.ok){
          if (res.status >= 500) retryable = true;  // 504等のサーバ側エラーは再試行
          logArr && logArr.push({t:'warn', msg:`${host} → HTTP ${res.status} → 別サーバへ切替`});
          continue;
        }
        const data = await res.json();
        if (!opts.noCache) cacheSet(query, data);
        return {data, cached:false, endpoint:host};
      } catch(e){
        const reason = e.name==='AbortError' ? `タイムアウト(${clientTimeout/1000}秒)` : e.message;
        logArr && logArr.push({t:'err', msg:`${host} → ${reason} → 別サーバへ切替`});
        retryable = true;  // タイムアウト・ネットワークエラーも一時的とみなし再試行
      }
    }
    // 全サーバ失敗。一時的エラー（429/5xx/timeout/network）なら待機して再試行。
    if (retryable && attempt < MAX_RETRY-1){
      logArr && logArr.push({t:'warn', msg:`サーバ混雑/エラー → ${RETRY_WAIT/1000}秒待機して再試行 (${attempt+1}/${MAX_RETRY})`});
      document.getElementById('status-text').textContent = `⏳ サーバ混雑/エラー…${RETRY_WAIT/1000}秒待機`;
      await sleep(RETRY_WAIT);
    } else if (!retryable) {
      break; // 4xx等：クエリ自体の問題なので再試行しても無駄
    }
  }
  return {data:null, cached:false};
}

// =====================================================================
// 幾何ユーティリティ
// =====================================================================
function haversine(a,b){
  const R=6371000, dLat=(b[0]-a[0])*Math.PI/180, dLon=(b[1]-a[1])*Math.PI/180;
  const x=Math.sin(dLat/2)**2 + Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.asin(Math.sqrt(x));
}
function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

// =====================================================================
// グラフ構築 → 乗車駅から全方向chain探索 → 降車駅到達chainを選択
// =====================================================================

// way端点を量子化してノードIDにする（約1.1m精度で端点一致を判定）
function nodeKey(lat, lon){ return lat.toFixed(5)+","+lon.toFixed(5); }

const NODE_MERGE = 75; // 近接端点をマージする閾値(m)。駅構内・会社境界の分断を吸収（§3-4で50→75）。
const MAX_CHAINS = 40;  // chain数の上限（分岐爆発防止）。到達失敗時に上限到達かをログ表示。
const MAX_STEPS = 4000; // 1 chainあたり最大way本数（step上限）。

// wayElements からグラフを構築。各wayは1本のエッジ。
// 端点は近接クラスタリングでマージ（直通運転の会社境界などで端点が数mずれても接続）。
// 返り値: { adj: Map<clusterKey, [{wayIdx, toKey, coords}]>, ways: [...] }
// way端点が他wayの「内部node」に一致する箇所（T字分岐・行き違い設備など）で
// そのwayを分割し、一致点を端点化してグラフ連結を可能にする。
//  out geom（座標のみ・node ID無し）前提のため座標一致で判定。共有nodeは座標が
//  完全一致（0m）するのでEPSは小さく取り、並走複線（通常>3m間隔）の誤結合を防ぐ。
function splitWaysAtJunctions(ways){
  if(!ways || ways.length<2) return {ways:ways||[], count:0};
  const EPS = 2;        // 同一nodeとみなす距離(m)。共有node=0m、並走別線≳3m。
  const cell = 0.0002;  // 候補絞り込み用グリッド（約22m四方）
  const bk = (lat,lon)=> Math.round(lat/cell)+','+Math.round(lon/cell);
  // 全wayの端点をグリッド索引化
  const epBuckets = new Map();
  for(const w of ways){
    for(const c of [w.coords[0], w.coords[w.coords.length-1]]){
      const k=bk(c[0],c[1]);
      if(!epBuckets.has(k)) epBuckets.set(k,[]);
      epBuckets.get(k).push({coord:c, wayIdx:w.idx});
    }
  }
  const out=[]; let nSplit=0;
  for(const w of ways){
    const cuts=new Set();
    // 内部頂点（端点を除く）が他wayの端点と一致するか
    for(let vi=1; vi<w.coords.length-1; vi++){
      const v=w.coords[vi];
      const ci=Math.round(v[0]/cell), cj=Math.round(v[1]/cell);
      let hit=false;
      for(let di=-1; di<=1 && !hit; di++) for(let dj=-1; dj<=1 && !hit; dj++){
        const arr=epBuckets.get((ci+di)+','+(cj+dj)); if(!arr) continue;
        for(const ep of arr){
          if(ep.wayIdx===w.idx) continue;             // 自分の端点は除外
          if(haversine(v, ep.coord) <= EPS){ hit=true; break; }
        }
      }
      if(hit) cuts.add(vi);
    }
    if(cuts.size===0){ out.push(w); continue; }
    // 分割点でサブwayに分割（座標・wayId・relIdは引き継ぐ）
    const cutArr=[0, ...[...cuts].sort((a,b)=>a-b), w.coords.length-1];
    for(let c=0; c<cutArr.length-1; c++){
      const seg=w.coords.slice(cutArr[c], cutArr[c+1]+1);
      if(seg.length>=2) out.push({idx:0, coords:seg, wayId:w.wayId, relId:w.relId});
    }
    nSplit += cuts.size;
  }
  out.forEach((w,i)=>w.idx=i);
  return {ways:out, count:nSplit};
}

function buildGraph(wayElements){
  let ways = wayElements
    .filter(el => el.geometry && el.geometry.length>=2)
    .map((el,i) => {
      const coords = el.geometry.map(g=>[g.lat,g.lon]);
      return { idx:i, coords, wayId: el.id, relId: el._relId || null };
    });

  // T字分岐（端点が他wayの内部nodeに一致）でwayを分割し連結を回復
  const splitInfo = splitWaysAtJunctions(ways);
  ways = splitInfo.ways;

  // 全wayの端点を集める
  const endpoints = []; // {wayIdx, end:'start'|'end', coord}
  for(const w of ways){
    endpoints.push({wayIdx:w.idx, end:'start', coord:w.coords[0]});
    endpoints.push({wayIdx:w.idx, end:'end', coord:w.coords[w.coords.length-1]});
  }

  // 端点をクラスタリング: 量子化グリッドで近接候補を絞り、NODE_MERGE以内を同一クラスタに
  // グリッドセル（約0.0005度≒50m四方）でバケット化
  const cell = 0.0005;
  const buckets = new Map();
  const bkey = (lat,lon)=> Math.round(lat/cell)+","+Math.round(lon/cell);
  endpoints.forEach((ep,i)=>{
    const k=bkey(ep.coord[0],ep.coord[1]);
    if(!buckets.has(k)) buckets.set(k,[]);
    buckets.get(k).push(i);
  });

  // Union-Find で近接端点をマージ
  const parent = endpoints.map((_,i)=>i);
  const find = x => { while(parent[x]!==x){ parent[x]=parent[parent[x]]; x=parent[x]; } return x; };
  const union = (a,b)=>{ const ra=find(a),rb=find(b); if(ra!==rb) parent[ra]=rb; };

  endpoints.forEach((ep,i)=>{
    const [lat,lon]=ep.coord;
    const ci=Math.round(lat/cell), cj=Math.round(lon/cell);
    // 隣接9セルを調べる
    for(let di=-1;di<=1;di++) for(let dj=-1;dj<=1;dj++){
      const k=(ci+di)+","+(cj+dj);
      const arr=buckets.get(k); if(!arr) continue;
      for(const j of arr){
        if(j<=i) continue;
        if(haversine(ep.coord, endpoints[j].coord) <= NODE_MERGE) union(i,j);
      }
    }
  });

  // クラスタ代表 → クラスタキー文字列
  const clusterKeyOf = epIdx => "C"+find(epIdx);

  // 各wayの始点・終点クラスタキーを求める
  const epIndexOf = {}; // wayIdx+'_'+end → endpoints index
  endpoints.forEach((ep,i)=>{ epIndexOf[ep.wayIdx+'_'+ep.end]=i; });
  ways.forEach(w=>{
    w.startKey = clusterKeyOf(epIndexOf[w.idx+'_start']);
    w.endKey   = clusterKeyOf(epIndexOf[w.idx+'_end']);
  });

  const adj = new Map();
  const addEdge = (fromKey, w, reversed) => {
    if(!adj.has(fromKey)) adj.set(fromKey, []);
    const coords = reversed ? [...w.coords].reverse() : w.coords;
    const toKey = reversed ? w.startKey : w.endKey;
    adj.get(fromKey).push({wayIdx:w.idx, toKey, coords, relId:w.relId});
  };
  for(const w of ways){
    addEdge(w.startKey, w, false);
    addEdge(w.endKey, w, true);
  }
  return {adj, ways, junctionSplits: splitInfo.count};
}

// 座標に最も近いノードキー（クラスタ）を探す
function nearestNodeKey(adj, ways, coord){
  let best=null, bd=Infinity;
  for(const w of ways){
    const cand=[[w.coords[0],w.startKey],[w.coords[w.coords.length-1],w.endKey]];
    for(const [pt,key] of cand){
      const d=haversine(coord, pt);
      if(d<bd){ bd=d; best=key; }
    }
  }
  return {key:best, dist:bd};
}

// --- 最短経路探索（Dijkstra） ---
// buildGraph のノードグラフ上で、起点ノード→終点ノードの最短経路を求める。
// 辺重み = way区間長。得られる経路は単一の連続ポリライン（往復スパーを含まない）。
function polyLen(coords){ let s=0; for(let i=1;i<coords.length;i++) s+=haversine(coords[i-1],coords[i]); return s; }

// 二分ヒープ（最小優先度）
class MinHeap{
  constructor(){ this.a=[]; }
  get size(){ return this.a.length; }
  push(key,priority){ const a=this.a; a.push({key,priority}); let i=a.length-1;
    while(i>0){ const p=(i-1)>>1; if(a[p].priority<=a[i].priority) break; [a[p],a[i]]=[a[i],a[p]]; i=p; } }
  pop(){ const a=this.a, top=a[0], last=a.pop();
    if(a.length){ a[0]=last; let i=0,n=a.length;
      while(true){ let l=2*i+1,r=2*i+2,m=i;
        if(l<n&&a[l].priority<a[m].priority)m=l; if(r<n&&a[r].priority<a[m].priority)m=r;
        if(m===i)break; [a[m],a[i]]=[a[i],a[m]]; i=m; } }
    return top; }
}

// startKey→endKey の最短経路。返り値 {found, coords, routeLen, relIds, hops, reached(Set)}
function dijkstraRoute(graph, startKey, endKey){
  const {adj}=graph;
  const dist=new Map([[startKey,0]]);
  const prev=new Map();
  const done=new Set();
  const pq=new MinHeap(); pq.push(startKey,0);
  while(pq.size){
    const {key:u,priority:d}=pq.pop();
    if(done.has(u)) continue; done.add(u);
    if(u===endKey) break;
    if(d>(dist.get(u)??Infinity)) continue;
    for(const e of (adj.get(u)||[])){
      if(e.weight==null) e.weight=polyLen(e.coords);
      const nd=d+e.weight;
      if(nd<(dist.get(e.toKey)??Infinity)){ dist.set(e.toKey,nd); prev.set(e.toKey,{from:u,edge:e}); pq.push(e.toKey,nd); }
    }
  }
  if(startKey===endKey || !prev.has(endKey)) return {found:false, reached:done, dist, prev};
  // 経路復元（start→end）。各辺のcoordsはfrom→toに整列済み。
  const edges=[]; let cur=endKey;
  while(cur!==startKey){ const p=prev.get(cur); if(!p) return {found:false, reached:done, dist, prev}; edges.unshift(p.edge); cur=p.from; }
  const coords=[]; const relIds=new Set(); const wayIds=new Set();
  for(const e of edges){
    if(coords.length===0) coords.push(...e.coords); else coords.push(...e.coords.slice(1));
    if(e.relId!=null) relIds.add(e.relId);
    const w=graph.ways[e.wayIdx]; if(w&&w.wayId!=null) wayIds.add(w.wayId);
  }
  return {found:true, coords, routeLen:dist.get(endKey), relIds, wayIds, hops:edges.length, reached:done, dist, prev};
}

// ノードキー→代表座標（分断箇所診断用）
function nodeCoordMap(ways){
  const m=new Map();
  for(const w of ways){ if(!m.has(w.startKey)) m.set(w.startKey,w.coords[0]); if(!m.has(w.endKey)) m.set(w.endKey,w.coords[w.coords.length-1]); }
  return m;
}
// 到達可能ノードのうち目標座標に最も近い点（＝分断箇所の手前）
function nearestReachable(reached, ncoord, target){
  let best=null,bd=Infinity,bk=null;
  for(const k of reached){ const c=ncoord.get(k); if(!c) continue; const d=haversine(c,target); if(d<bd){bd=d;best=c;bk=k;} }
  return best?{coord:best,gap:bd,key:bk}:null;
}

function calcBbox(seg){
  if(seg.bbox) return seg.bbox;
  if(!seg.fallback?.length) return null;
  let mnLat=90,mxLat=-90,mnLon=180,mxLon=-180;
  seg.fallback.forEach(c=>{
    if(c[0]<mnLat)mnLat=c[0]; if(c[0]>mxLat)mxLat=c[0];
    if(c[1]<mnLon)mnLon=c[1]; if(c[1]>mxLon)mxLon=c[1];
  });
  const pad=0.05;
  return [mnLat-pad, mnLon-pad, mxLat+pad, mxLon+pad];
}

// relation単位でwayジオメトリを個別取得（クエリ文字列キャッシュは使わない＝採用relationのみ別途保存する方針）
async function fetchRelGeomNoCache(rid, log){
  const q=`[out:json][timeout:25];
relation(id:${rid});
way(r)["railway"~"rail|narrow_gauge|tram|light_rail|monorail|subway|funicular"];
out geom;`;
  const r = await fetchOverpass(q, log, {noCache:true});
  if(!r.data?.elements) return {ways:null, endpoint:r.endpoint};
  const ways = r.data.elements.filter(e=>e.type==='way'&&e.geometry?.length>=2);
  return {ways, endpoint:r.endpoint};
}

// 戦略A: 路線名でrelation取得（2段階・relation別フェッチ＋「採用relationだけ」キャッシュ）
//  Step1: 発着駅の小bbox(union)で名前一致relationの ID＋タグのみ取得（out tags;）。【クエリ文字列でキャッシュ】
//  Step2: relation IDごとに geometry を個別取得。【relation単位キャッシュ osmrel_、採用分のみ保存・slim形式】
//  高速パス: 区間の前回採用relation(osmseg_)があれば、そのrelationだけ取得して再探索（再実行を高速化）。
//  マージはグラフ構築時のみ（Dijkstraは全wayの結合グラフで最短経路を解くため事業者跨ぎ直通もそのまま）。
// 経由駅(seg.via)の正規化: [["駅名", lat, lon, "路線名候補1", ...], ...] → [{name, pt, lines}]
function parseVia(seg){
  return (seg.via||[])
    .filter(v=>Array.isArray(v) && v.length>=3 && isFinite(+v[1]) && isFinite(+v[2]))
    .map(v=>({name:String(v[0]), pt:[+v[1], +v[2]], lines:v.slice(3).map(String).filter(Boolean)}));
}

async function strategyByLineName(seg, bbox, log, forceFull=false){
  const baseNames = seg.lineNames || (seg.lineName?[seg.lineName]:[]);
  const viaList = parseVia(seg);
  const lineNames = [...new Set([...baseNames, ...viaList.flatMap(v=>v.lines)])];
  if(lineNames.length===0) return null;
  const dep = seg.fallback?.[0];
  const arr = seg.fallback?.[seg.fallback.length-1];
  if(!dep || !arr) return null;
  const delta = 0.01; // ±0.01°≈1.1km
  const fmt = v => v.toFixed(5);
  const boxOf = pt => `${fmt(pt[0]-delta)},${fmt(pt[1]-delta)},${fmt(pt[0]+delta)},${fmt(pt[1]+delta)}`;
  const depBox = boxOf(dep);
  const arrBox = boxOf(arr);
  const isSamePoint = dep[0]===arr[0] && dep[1]===arr[1];
  const nameRegex = lineNames.map(escapeRegex).join("|");
  const routeType = `"route"~"train|tram|light_rail|monorail|subway|railway"`;
  const nameCond  = `"name"~"${nameRegex}"`;
  if(viaList.length) log.push({t:'info', msg:`経由駅(via): ${viaList.map(v=>`${v.name}(${v.lines.join('・')||'路線名追加なし'})`).join(' / ')}`});

  // ---- Step1: relationの ID＋タグのみ（軽量・クエリ文字列キャッシュ） ----
  //  bbox = 乗車駅±0.01° ∪ 降車駅±0.01° ∪ 各経由駅±0.01°（経由駅でしか路線に掛からないケースに対応）
  const viaBoxLines = viaList.map(v=>`
  relation[${routeType}][${nameCond}](${boxOf(v.pt)});`).join('');
  const q1=`[out:json][timeout:10];
(
  relation[${routeType}][${nameCond}](${depBox});${isSamePoint ? '' : `
  relation[${routeType}][${nameCond}](${arrBox});`}${viaBoxLines}
);
out tags;`;
  const t1=performance.now();
  const r1 = await fetchOverpass(q1, log);
  const dt1=((performance.now()-t1)/1000).toFixed(1);
  if(!r1.data?.elements){
    log.push({t:'err', msg:`戦略A Step1: relation検索失敗 (${dt1}秒)`});
    return null;
  }
  const rels = r1.data.elements.filter(e=>e.type==='relation');
  const relInfo = new Map();
  for(const rel of rels){
    relInfo.set(rel.id, { name: rel.tags?.name || null, operator: rel.tags?.operator || rel.tags?.network || null });
  }
  const relIds = rels.map(e=>e.id);
  const relNames = [...new Set(rels.map(e=>e.tags?.name).filter(Boolean))];
  log.push({t:'ok', msg:`戦略A Step1: ${r1.cached?'キャッシュ':'API'+(r1.endpoint?'('+r1.endpoint+')':'')}から relation ${relIds.length}件 (${dt1}秒)`});
  log.push({t:'info', msg:`　検索路線名: ${lineNames.join(' / ')}`});
  log.push({t:'info', msg:`　OSM一致relation(${relNames.length}): ${relNames.join(' / ')||'(なし)'}`});
  log.push({t:'info', msg:`　relationID: ${relIds.join(', ')||'なし'}`});
  if(relIds.length===0) return null;

  // ---- 取得対象relationの決定（高速パス: 前回採用relationのみ） ----
  let targetRelIds = relIds;
  let usedFastPath = false;
  if(!forceFull){
    const cachedAdopted = segRelsGet(seg);
    if(cachedAdopted && cachedAdopted.length){
      const matchedSet = new Set(relIds);
      const subset = cachedAdopted.filter(id=>matchedSet.has(id));
      if(subset.length){ targetRelIds = subset; usedFastPath = true; }
    }
  }
  if(usedFastPath){
    log.push({t:'info', msg:`戦略A Step2: 前回採用の relation ${targetRelIds.length}件のみ取得（高速パス）: ${targetRelIds.join(', ')}`});
  } else {
    log.push({t:'info', msg:`戦略A Step2: relation別に ${targetRelIds.length}件取得（セッション→relキャッシュ→API の順・採用分のみ保存）`});
  }

  // ---- Step2: relation別にジオメトリ取得（セッション→relキャッシュ→API の順） ----
  const seen = new Set();   // wayId重複排除（複数relationが同一wayを共有する場合・先勝ち）
  const allWays = [];
  for(let i=0;i<targetRelIds.length;i++){
    const rid = targetRelIds[i];
    const info = relInfo.get(rid)||{};
    const t2 = performance.now();
    let ways = SESSION_REL_GEOM.get(rid);
    let src;
    if(ways){ src='session'; }
    else if((ways = relCacheGet(rid))){ src='relcache'; SESSION_REL_GEOM.set(rid, ways); }
    else {
      const r = await fetchRelGeomNoCache(rid, log);
      ways = r.ways;
      if(!ways){
        const dtf=((performance.now()-t2)/1000).toFixed(1);
        log.push({t:'warn', msg:`　[${i+1}/${targetRelIds.length}] relation ${rid}（${info.name||'?'}）: way取得失敗 (${dtf}秒) → スキップ`});
        continue;
      }
      src = r.endpoint||'api';
      SESSION_REL_GEOM.set(rid, ways);
      SESSION_FETCHED.add(rid);
    }
    const dt2=((performance.now()-t2)/1000).toFixed(1);
    let added=0;
    for(const w of ways){
      if(seen.has(w.id)) continue;
      seen.add(w.id);
      w._relId = rid; w._operator = info.operator||null;
      allWays.push(w); added++;
    }
    log.push({t:'info', msg:`　[${i+1}/${targetRelIds.length}] relation ${rid}（${info.name||'?'}）: ${ways.length}way / 新規${added} (${src}, ${dt2}秒)`});
  }

  if(allWays.length>0){
    log.push({t:'ok', msg:`戦略A: 計${allWays.length}way（重複排除後）/ relation ${targetRelIds.length}件をマージ`});
    const opsFound=[...new Set(allWays.map(w=>w._operator).filter(Boolean))];
    log.push({t:'info', msg:`　事業者(operator): ${opsFound.join(' / ')||'(タグなし)'}`});
    const relStats={};
    allWays.forEach(w=>{ const r=w._relId??'null'; relStats[r]=(relStats[r]||0)+1; });
    Object.entries(relStats).forEach(([rel,cnt])=>{ log.push({t:'info', msg:`　relation ${rel}: ${cnt} way`}); });
  } else {
    log.push({t:'warn', msg:`戦略A: 対象relationでway取得できず`});
  }

  return {wayEls:allWays, relNames, usedFastPath};
}

// 戦略B: 乗降駅周辺の全鉄道way（路線名非依存）
async function strategyByArea(seg, bbox, log){
  const fromCoord=seg.fallback?.[0], toCoord=seg.fallback?.[seg.fallback.length-1];
  if(!fromCoord||!toCoord) return null;
  const pad=0.03;
  const S=Math.min(fromCoord[0],toCoord[0])-pad, N=Math.max(fromCoord[0],toCoord[0])+pad;
  const W=Math.min(fromCoord[1],toCoord[1])-pad, E=Math.max(fromCoord[1],toCoord[1])+pad;
  const q=`[out:json][timeout:40];
relation["route"~"train|railway|monorail|high_speed"]["name"~"新幹線|Shinkansen"](${S},${W},${N},${E})->.shin;
way(r.shin)->.shinways;
( way["railway"~"rail|narrow_gauge|tram|light_rail|monorail|subway|funicular"](${S},${W},${N},${E}); - .shinways; );
out geom;`;
  const t0=performance.now();
  const {data, cached, endpoint}=await fetchOverpass(q, log);
  const dt=((performance.now()-t0)/1000).toFixed(1);
  if(!data?.elements){
    log.push({t:'err', msg:`戦略B(エリア): データ取得失敗 (${dt}秒)`});
    return null;
  }
  const wayEls=data.elements.filter(e=>e.type==='way'&&e.geometry?.length>=2);
  wayEls.forEach(w=>{ w._relId=null; });
  log.push({t:'ok', msg:`戦略B(エリア): ${cached?'キャッシュ':'API'+(endpoint?'('+endpoint+')':'')}から取得 (${dt}秒)`});
  log.push({t:'info', msg:`　エリア内way数: ${wayEls.length}`});
  if(wayEls.length===0) return null;
  return {wayEls, relNames:['(エリア検索)']};
}

// seg.wayQuery を解決（明示指定が最優先。未指定なら type/名前から自動判定）。
//  返り値: 文字列配列（"ferry" | "funicular" | "aerialway"）。該当なしは []。
//  seg.wayQuery==="none" で自動判定を無効化。
function resolveWayQuery(seg){
  if(seg.wayQuery==='none') return [];
  if(seg.wayQuery) return Array.isArray(seg.wayQuery) ? seg.wayQuery : [seg.wayQuery];
  const kinds = [];
  const ty = seg.type || '';
  const txt = `${seg.name||''} ${(seg.lineNames||[]).join(' ')} ${seg.lineName||''}`;
  if(ty==='ferry' || /フェリー|航路|汽船|連絡船|渡船|ferry/i.test(txt)) kinds.push('ferry');
  if(/ロープウェ|ロープウェイ|ゴンドラ|索道|aerial|ropeway/i.test(txt)) kinds.push('aerialway');
  if(ty==='cable' || /ケーブル|鋼索|funicular/i.test(txt)) kinds.push('funicular');
  return [...new Set(kinds)];
}

// 戦略C: フェリー(route=ferry)・ケーブル(railway=funicular)・ロープウェイ(aerialway)を way で直接取得。
//  これらは単独way主体でrelation検索(戦略A)では拾えないため、タグ一致のwayを1クエリで取得する。
//  kinds: resolveWayQuery(seg) の結果。lineNames があれば名前で絞り込むが、
//  名前がOSM実名と食い違うケースに備え「名前なし(タグのみ)」も union して必ず拾えるようにする。
//  発着駅±0.02°のunion bbox（航路・索道は駅間が空くので広め）。
async function strategyByWayName(seg, bbox, log, kinds){
  kinds = kinds || resolveWayQuery(seg);
  const lineNames = seg.lineNames || (seg.lineName?[seg.lineName]:[]);
  const dep = seg.fallback?.[0], arr = seg.fallback?.[seg.fallback.length-1];
  if(!dep || !arr){ log.push({t:'err', msg:'戦略C: 始終点座標なし'}); return null; }
  const delta = 0.02; // ±0.02°≈2.2km
  const fmt = v => v.toFixed(5);
  const boxOf = pt => `${fmt(pt[0]-delta)},${fmt(pt[1]-delta)},${fmt(pt[0]+delta)},${fmt(pt[1]+delta)}`;
  const isSamePoint = dep[0]===arr[0] && dep[1]===arr[1];
  const boxes = isSamePoint ? [dep] : [dep, arr];
  // tag条件: ferry→route=ferry, funicular→railway=funicular, aerialway→aerialway(全種)
  const tagCond = k => k==='ferry' ? `["route"="ferry"]`
                    : k==='funicular' ? `["railway"="funicular"]`
                    : k==='aerialway' ? `["aerialway"]` : null;
  const nameRegex = lineNames.length ? lineNames.map(escapeRegex).join('|') : null;
  const parts = [];
  for(const k of kinds){
    const tc = tagCond(k);
    if(!tc){ log.push({t:'warn', msg:`戦略C: 未知のwayQuery「${k}」をスキップ`}); continue; }
    for(const b of boxes){
      // 名前ありで絞った候補 + 名前なし(タグのみ)候補 の両方をunion（名前不一致でも拾う）
      if(nameRegex) parts.push(`  way${tc}["name"~"${nameRegex}"](${boxOf(b)});`);
      parts.push(`  way${tc}(${boxOf(b)});`);
    }
  }
  if(!parts.length){ log.push({t:'warn', msg:'戦略C: 対象種別なし（resolveWayQueryが空）'}); return null; }

  // まずway直接キャッシュ（osmway_）を確認（osm_クエリキャッシュより退避されにくい）
  const cachedWays = wayCacheGet(seg);
  if(cachedWays && cachedWays.length){
    const wayEls = cachedWays.map(w=>({id:w.id, geometry:w.geometry, tags:w.name?{name:w.name}:{}, _relId:null}));
    const names=[...new Set(cachedWays.map(w=>w.name).filter(Boolean))];
    log.push({t:'ok', msg:`戦略C(${kinds.join('/')}): way直接キャッシュHIT way ${wayEls.length}件`});
    log.push({t:'info', msg:`　一致way名(${names.length}): ${names.join(' / ')||'(なし)'}`});
    return {wayEls, relNames:['(way直接キャッシュ)']};
  }

  const q=`[out:json][timeout:15];
(
${parts.join('\n')}
);
out geom;`;
  const t0=performance.now();
  const {data, cached, endpoint}=await fetchOverpass(q, log);
  const dt=((performance.now()-t0)/1000).toFixed(1);
  if(!data?.elements){
    log.push({t:'err', msg:`戦略C(${kinds.join('/')}): データ取得失敗 (${dt}秒)`});
    return null;
  }
  const wayEls=data.elements.filter(e=>e.type==='way'&&e.geometry?.length>=2);
  wayEls.forEach(w=>{ w._relId=null; });
  const names=[...new Set(wayEls.map(w=>w.tags?.name).filter(Boolean))];
  log.push({t:'ok', msg:`戦略C(${kinds.join('/')}): ${cached?'キャッシュ':'API'+(endpoint?'('+endpoint+')':'')}から way ${wayEls.length}件 (${dt}秒)`});
  log.push({t:'info', msg:`　検索名: ${lineNames.join(' / ')||'(名前指定なし)'}`});
  log.push({t:'info', msg:`　一致way名(${names.length}): ${names.join(' / ')||'(なし)'}`});
  if(wayEls.length===0) return null;
  // way直接キャッシュに保存（次回はこのwayでDijkstra＝API不要）
  wayCacheSet(seg, wayEls);
  return {wayEls, relNames:['(way直接検索)']};
}

// バス区間判定（type=="bus" または 名称/路線名にバス系の語）。電車系とは独立。
function isBusSeg(seg){
  if(seg.busQuery==='none') return false;
  if(seg.type==='bus' || seg.busQuery) return true;
  const txt = `${seg.name||''} ${(seg.lineNames||[]).join(' ')} ${seg.lineName||''}`;
  return /バス|ばす|\bbus\b|系統/i.test(txt);
}

// 戦略D: 路線バス（route=bus）専用。電車系の戦略A/B/Cとは完全に独立した取得関数。
//  bus routeは relation で表現されることが多いので、Step1で route=bus relationをbboxから探し、
//  Step2で各relationのway geometryを取得してグラフ化（電車のrelation 2段階と同様だが route=bus固定）。
//  優先度は低めだが、京阪バス等の山内連絡に対応。
async function strategyByBus(seg, bbox, log){
  const lineNames = seg.lineNames || (seg.lineName?[seg.lineName]:[]);
  const dep = seg.fallback?.[0], arr = seg.fallback?.[seg.fallback.length-1];
  if(!dep || !arr){ log.push({t:'err', msg:'戦略D(bus): 始終点座標なし'}); return null; }
  const delta = 0.02; // バスは停留所間隔が広めなので±0.02°
  const fmt = v => v.toFixed(5);
  const boxOf = pt => `${fmt(pt[0]-delta)},${fmt(pt[1]-delta)},${fmt(pt[0]+delta)},${fmt(pt[1]+delta)}`;
  const isSame = dep[0]===arr[0] && dep[1]===arr[1];
  const boxes = isSame ? [dep] : [dep, arr];
  const nameRegex = lineNames.length ? lineNames.map(escapeRegex).join('|') : null;
  const nameCond = nameRegex ? `["name"~"${nameRegex}"]` : '';

  // Step1: route=bus relationのID＋タグ
  const relParts = boxes.map(b=>`  relation["route"="bus"]${nameCond}(${boxOf(b)});`).join('\n');
  const q1=`[out:json][timeout:15];
(
${relParts}
);
out tags;`;
  const t1=performance.now();
  const r1=await fetchOverpass(q1, log);
  const dt1=((performance.now()-t1)/1000).toFixed(1);
  if(!r1.data?.elements){ log.push({t:'err', msg:`戦略D(bus): relation取得失敗 (${dt1}秒)`}); return null; }
  let rels=r1.data.elements.filter(e=>e.type==='relation');
  log.push({t:'ok', msg:`戦略D(bus) Step1: ${r1.cached?'キャッシュ':'API'+(r1.endpoint?'('+r1.endpoint+')':'')}から relation ${rels.length}件 (${dt1}秒)`});
  log.push({t:'info', msg:`　検索路線名: ${lineNames.join(' / ')||'(指定なし)'}`});
  if(!rels.length){
    // relが無ければ way[route=bus] 直接取得にフォールバック
    log.push({t:'info', msg:'　route=bus relationなし → way[route=bus]直接取得を試行'});
    const wParts=[];
    for(const b of boxes){ if(nameRegex) wParts.push(`  way["route"="bus"]["name"~"${nameRegex}"](${boxOf(b)});`); wParts.push(`  way["route"="bus"](${boxOf(b)});`); }
    const q2=`[out:json][timeout:15];
(
${wParts.join('\n')}
);
out geom;`;
    const t2=performance.now();
    const r2=await fetchOverpass(q2, log);
    const dt2=((performance.now()-t2)/1000).toFixed(1);
    const wayEls=(r2.data?.elements||[]).filter(e=>e.type==='way'&&e.geometry?.length>=2);
    wayEls.forEach(w=>{ w._relId=null; });
    log.push({t:wayEls.length?'ok':'warn', msg:`戦略D(bus): way直接取得 ${wayEls.length}件 (${dt2}秒)`});
    return wayEls.length ? {wayEls, relNames:['(bus way直接)']} : null;
  }
  // Step2: 各relationのway geometry
  const relNames=rels.map(r=>r.tags?.name).filter(Boolean);
  const allWays=[]; const seen=new Set();
  const t2=performance.now();
  for(const rel of rels){
    const q=`[out:json][timeout:20];
relation(id:${rel.id});
way(r);
out geom;`;
    const rr=await fetchOverpass(q, log);
    const ways=(rr.data?.elements||[]).filter(e=>e.type==='way'&&e.geometry?.length>=2);
    for(const w of ways){ if(seen.has(w.id)) continue; seen.add(w.id); w._relId=rel.id; allWays.push(w); }
  }
  const dt2=((performance.now()-t2)/1000).toFixed(1);
  log.push({t:'ok', msg:`戦略D(bus) Step2: relation ${rels.length}件から way ${allWays.length}件取得 (${dt2}秒)`});
  log.push({t:'info', msg:`　bus路線名: ${[...new Set(relNames)].join(' / ')||'(なし)'}`});
  return allWays.length ? {wayEls:allWays, relNames} : null;
}

async function fetchRailCoords(seg, log){
  if(seg.fallbackSkip){ log.push({t:'info', msg:'fallbackSkip指定 → API取得せず直線描画'}); return null; }
  const bbox=calcBbox(seg);
  if(!bbox){ log.push({t:'err', msg:'bbox計算不可'}); return null; }
  const fromCoord=seg.fallback?.[0], toCoord=seg.fallback?.[seg.fallback.length-1];
  if(!fromCoord||!toCoord){ log.push({t:'err', msg:'始終点座標なし'}); return null; }

  log.push({t:'info', msg:`乗車駅(fallback始点): [${fromCoord[0].toFixed(4)}, ${fromCoord[1].toFixed(4)}]`});
  log.push({t:'info', msg:`降車駅(fallback終点): [${toCoord[0].toFixed(4)}, ${toCoord[1].toFixed(4)}]`});

  // ルート探索: 戦略Aの名前一致wayで最短経路。届かなければ戦略B(エリア)。
  const directLen = haversine(fromCoord, toCoord);

  // via座標リスト（経路を必ず通過させる経由点）。parseViaで正規化済みのものを使う。
  const viaPts = parseVia(seg).map(v=>v.pt);

  // 1レグ（pA→pB）の最短経路をグラフ上で求める。返り値に各種メタを含む。
  //  経路が無い場合は到達範囲の最近接ノードまで（partial/代替）を返す。完全不能はnull。
  const routeLeg = (graph, pA, pB, label) => {
    const s = nearestNodeKey(graph.adj, graph.ways, pA);
    const e = nearestNodeKey(graph.adj, graph.ways, pB);
    if(!s.key || !e.key) return null;
    const r = dijkstraRoute(graph, s.key, e.key);
    if(r.found){
      return {coords:r.coords, startGap:s.dist, endGap:e.dist, routeLen:r.routeLen, relIds:[...r.relIds], wayIds:r.wayIds, partial:false, snapNodes:graph.adj.size, wayCount:graph.ways.length};
    }
    // 非連結 → 到達範囲の終点最近接まで部分復元
    const near = nearestReachable(r.reached, nodeCoordMap(graph.ways), pB);
    if(near && near.key !== s.key){
      const edges = []; let cur = near.key;
      while(cur !== s.key){ const p = r.prev.get(cur); if(!p) break; edges.unshift(p.edge); cur = p.from; }
      if(edges.length > 0){
        const coords = []; const relIds = new Set(); const wayIds = new Set();
        for(const edge of edges){
          if(coords.length === 0) coords.push(...edge.coords); else coords.push(...edge.coords.slice(1));
          if(edge.relId != null) relIds.add(edge.relId);
          const w = graph.ways[edge.wayIdx]; if(w && w.wayId!=null) wayIds.add(w.wayId);
        }
        return {coords, startGap:s.dist, endGap:near.gap, routeLen:r.dist.get(near.key)||0, relIds:[...relIds], wayIds, partial:near.gap>NEAR_STATION, brokenAt:near.coord, snapNodes:graph.adj.size, wayCount:graph.ways.length};
      }
    }
    return {coords:null, startGap:s.dist, endGap:Infinity, routeLen:0, relIds:[], wayIds:new Set(), partial:true, unreachable:true, brokenAt:near?near.coord:null};
  };

  // 1グラフ分のルート探索。viaがあれば 出発→経由1→…→経由N→到着 を連結（経由駅を必ず通る）。
  const solve = (ways, label) => {
    const graph = buildGraph(ways);
    if(!graph.ways.length){ log.push({t:'warn', msg:`　${label}: way無し`}); return null; }
    if(graph.junctionSplits>0){ log.push({t:'info', msg:`　${label}: T字分岐 ${graph.junctionSplits}箇所でway分割（端点⇔内部node接続を回復）`}); }

    // 通過点列: [出発, via..., 到着]
    const pts = [fromCoord, ...viaPts, toCoord];
    if(viaPts.length){
      log.push({t:'info', msg:`　${label}: 経由駅優先で ${pts.length-1} レグに分割（${viaPts.map((p,i)=>`経由${i+1}[${p[0].toFixed(3)},${p[1].toFixed(3)}]`).join(' → ')}）`});
    }

    const allCoords=[]; const allRel=new Set(); const allWay=new Set();
    let totalLen=0, startGap=null, endGap=0, anyPartial=false, brokenAt=null;
    for(let i=0;i<pts.length-1;i++){
      const legLabel = viaPts.length ? `${label} レグ${i+1}/${pts.length-1}` : label;
      const leg = routeLeg(graph, pts[i], pts[i+1], legLabel);
      if(!leg){ log.push({t:'warn', msg:`　${legLabel}: スナップできるノードなし`}); return null; }
      if(i===0) startGap = leg.startGap;
      endGap = leg.endGap;
      if(leg.coords && leg.coords.length){
        if(allCoords.length===0) allCoords.push(...leg.coords);
        else allCoords.push(...leg.coords.slice(1)); // レグ境界の重複点を除去
        leg.relIds.forEach(x=>allRel.add(x));
        leg.wayIds.forEach(x=>allWay.add(x));
        totalLen += leg.routeLen;
      }
      if(leg.partial || leg.unreachable){
        anyPartial = true; brokenAt = leg.brokenAt || brokenAt;
        if(viaPts.length) log.push({t:'warn', msg:`　${legLabel}: このレグが未達（残り${(leg.endGap/1000).toFixed(1)}km）${leg.brokenAt?` 分断[${leg.brokenAt[0].toFixed(4)},${leg.brokenAt[1].toFixed(4)}]`:''}`});
        // viaレグの途中で切れたら以降のレグは繋がらないので打ち切り（描けた所まで）
        if(leg.unreachable) break;
      }
    }
    if(allCoords.length<2){
      log.push({t:'warn', msg:`　${label}: 有効な経路を構築できず（非連結・部分復元不可）`});
      if(brokenAt) log.push({t:'info', msg:`　　分断推定位置 [${brokenAt[0].toFixed(4)},${brokenAt[1].toFixed(4)}] 付近`});
      return null;
    }
    const relArr=[...allRel];
    if(anyPartial){
      log.push({t:'warn', msg:`　${label}: ${viaPts.length?'経由連結の一部が':''}未達 → 到達分を部分描画 経路長 ${(totalLen/1000).toFixed(1)}km / relation[${relArr.join(',')||'-'}]`});
      if(brokenAt) log.push({t:'info', msg:`　　分断推定位置 [${brokenAt[0].toFixed(4)},${brokenAt[1].toFixed(4)}] 付近`});
    } else {
      log.push({t:'ok', msg:`　${label}: 経路発見${viaPts.length?'（経由駅を通過）':''} 経路長 ${(totalLen/1000).toFixed(1)}km / relation[${relArr.join(',')||'-'}]`});
    }
    log.push({t:'info', msg:`　${label}: 乗車駅スナップ ${startGap.toFixed(0)}m / 降車駅スナップ ${endGap.toFixed(0)}m / ノード数 ${graph.adj.size} / way数 ${graph.ways.length}`});
    return {coords:allCoords, startGap, endGap, routeLen:totalLen, relIds:relArr, wayIdSet:allWay, partial:anyPartial};
  };

  // ---- 戦略D: 路線バス（route=bus）。電車系と独立。最優先で分岐（"バス"名称が索道判定に
  //  誤って引っかかるのを防ぐためCより先に判定）。 ----
  if(isBusSeg(seg)){
    log.push({t:'info', msg:`戦略D対象（route=bus）${seg.busQuery?'：busQuery指定':'：type/名称から自動判定'}`});
    const resD = await strategyByBus(seg, bbox, log);
    const rD = (resD && resD.wayEls.length) ? solve(resD.wayEls, '戦略D(bus)') : null;
    if(!rD || rD.coords.length<2){
      log.push({t:'err', msg:'戦略D(bus): 有効な経路を構築できず → fallback採用'});
      return null;
    }
    saveAdoptedRels(rD);
    return finalize(rD);
  }

  // ---- 戦略C: フェリー/ケーブル/ロープウェイ ----
  // wayQuery明示 または type/名前から自動判定（resolveWayQuery）で該当すれば専用ルート。
  // これらは単独way主体でrelation検索に乗らないため、戦略A/B/高速パスはスキップ。
  const wqKinds = resolveWayQuery(seg);
  if(wqKinds.length){
    log.push({t:'info', msg:`戦略C対象（${wqKinds.join('/')}）${seg.wayQuery?'：wayQuery指定':'：type/名称から自動判定'}`});
    const resC = await strategyByWayName(seg, bbox, log, wqKinds);
    const rC = (resC && resC.wayEls.length) ? solve(resC.wayEls, '戦略C') : null;
    if(!rC || rC.coords.length<2){
      log.push({t:'err', msg:'戦略C: 有効な経路を構築できず → fallback採用'});
      return null;
    }
    saveAdoptedRels(rC);
    return finalize(rC);
  }

  // ---- キャッシュ専用高速パス ----
  // 前回採用relation(osmseg_)が全てキャッシュ（セッション/relcache・部分キャッシュ可）に揃っていれば、
  // Step1(API)もスキップして即グラフ構築→Dijkstra。両端ギャップ≦FAST_SNAP(200m)なら採用。
  // 200mはNEAR_STATION(800m)より大幅に厳格＝「前回と同じ正しい経路が再現できた」場合のみ通す。
  // 不成立なら osmseg_ を破棄し、通常フロー（Step1→全relation取得）へ。
  let fastTried = false;
  {
    const adopted = segRelsGet(seg);
    if(adopted && adopted.length){
      // 採用relationのいずれかが間引き保存(partial)だと、高速パスのsolveは間引きwayで経路を
      // 再現できず未達になる公算が高い（大型relを通る区間で頻発）。その場合は無駄な高速パス試行を
      // 避け、通常フローへ直行（relcacheに完全版があればAPIは叩かない）。
      // 0613-8: via区間限定だった判定を全区間に拡張（新快速・新幹線等の毎回フル取得を解消）。
      let anyPartialCache = false; let partialRid=null;
      for(const rid of adopted){
        if(SESSION_REL_GEOM.has(rid)) continue; // セッション完全版があればOK
        if(relCacheIsPartial(rid)){ anyPartialCache = true; partialRid=rid; break; }
      }
      if(anyPartialCache){
        log.push({t:'info', msg:`高速パス: 採用relation ${partialRid} が間引きキャッシュ → スキップし通常フローで完全版を取得・保存（無駄な未達試行を回避）`});
      } else {
      const cachedWays=[]; const seenW=new Set(); let missing=null;
      for(const rid of adopted){
        const ways = SESSION_REL_GEOM.get(rid) || relCacheGet(rid, true);
        if(!ways){ missing=rid; break; }
        for(const w of ways){
          if(seenW.has(w.id)) continue;
          seenW.add(w.id);
          cachedWays.push({id:w.id, geometry:w.geometry, _relId:rid});
        }
      }
      if(missing==null && cachedWays.length){
        fastTried = true;
        log.push({t:'info', msg:`高速パス: 前回採用relation ${adopted.length}件が全てキャッシュ済 → Step1/Step2をスキップして先行試行（way ${cachedWays.length}）`});
        const rF = solve(cachedWays, '高速パス');
        if(rF && !rF.partial && rF.startGap<=FAST_SNAP && rF.endGap<=FAST_SNAP){
          log.push({t:'ok', msg:`高速パス採用（両端ギャップ ${rF.startGap.toFixed(0)}m/${rF.endGap.toFixed(0)}m ≦ ${FAST_SNAP}m）`});
          segRelsSet(seg, adopted); // TTL更新
          return finalize(rF);
        }
        log.push({t:'warn', msg:`高速パス不採用（${rF ? `ギャップ ${rF.startGap.toFixed(0)}m/${rF.endGap.toFixed(0)}m が ${FAST_SNAP}m超` : '経路なし'}）→ 通常フロー（全relation再取得）へ`});
        try { localStorage.removeItem(segRelsKey(seg)); } catch(e){}
      } else if(missing!=null){
        log.push({t:'info', msg:`高速パス: relation ${missing} がキャッシュ未保持 → 通常フロー（Step2内の採用分限定取得は有効）`});
      }
      }
    }
  }

  // 戦略A（路線名一致way）。キャッシュ専用高速パスを試行済みなら forceFull=true で全relation取得
  // （同じキャッシュ部分集合での再失敗を防ぐ）。未試行ならStep2内高速パス（採用分のみAPI取得）有効。
  let resA = await strategyByLineName(seg, bbox, log, fastTried);
  let result = (resA && resA.wayEls.length) ? solve(resA.wayEls, '戦略A') : null;

  // Step2内高速パスで降車駅に届かなければ、全relationで再取得して再探索
  if(resA && resA.usedFastPath && (!result || result.endGap > NEAR_STATION)){
    log.push({t:'warn', msg:`　戦略A(高速パス)で降車駅に届かず（${result ? 'ギャップ '+result.endGap.toFixed(0)+'m' : '経路なし'}）→ 全relationで再取得`});
    try { localStorage.removeItem(segRelsKey(seg)); } catch(e){}
    resA = await strategyByLineName(seg, bbox, log, true);
    result = (resA && resA.wayEls.length) ? solve(resA.wayEls, '戦略A') : null;
  }

  // 戦略Aで降車駅に届かない → 戦略B（エリア・新幹線除外）。設定でON/OFF。
  const insufficientA = !result || result.endGap > NEAR_STATION;
  if(insufficientA){
    const reason = result ? '終点ギャップ '+result.endGap.toFixed(0)+'m' : '経路なし';
    if(USE_STRATEGY_B){
      log.push({t:'warn', msg:`戦略Aで降車駅に到達できず（${reason}）→ 戦略B(エリア)を試行`});
      const resB = await strategyByArea(seg, bbox, log);
      if(resB && resB.wayEls.length){
        const rB = solve(resB.wayEls, '戦略B');
        if(rB && (!result || rB.endGap < result.endGap)){
          result = rB;
          log.push({t:'ok', msg:`　→ 戦略Bの結果を採用`});
        } else {
          log.push({t:'info', msg:`　→ 戦略Aを維持`});
        }
      }
    } else {
      log.push({t:'warn', msg:`戦略Aで降車駅に到達できず（${reason}）→ 戦略Bは無効設定のためスキップ`});
    }
  }

  // 採用relationをキャッシュ保存する共通処理（戦略A/B/C/D 共用）。
  //  - 両端とも駅へ十分到達（NEAR_STATION以内）かつ部分経路でない結果のみ保存。
  //  - このセッションでAPI取得した分のみ書く（SESSION_FETCHEDで管理）。
  //  - 大型relationは採用wayのみ間引き保存。ただしvia区間は完全保存（レグ連結のため）。
  //  - relIdを持つ採用relation（戦略A/B/D）はrelcache＋segRelsに記録。
  //    戦略Cのフェリー/索道は単独way（relIdなし）が多く、その場合はsegRelsに残せないが、
  //    SESSION内で取得済みなら次回もセッションキャッシュ/relcacheに載る。
  function saveAdoptedRels(result){
    if(!(result && result.relIds && result.relIds.length && !result.partial
         && result.startGap <= NEAR_STATION && result.endGap <= NEAR_STATION)) return;
    const hasVia = parseVia(seg).length > 0;
    let wrote=0; const thinned=[];
    for(const rid of result.relIds){
      if(rid==null) continue;
      if(SESSION_FETCHED.has(rid) && SESSION_REL_GEOM.has(rid)){
        const rr = relCacheSet(rid, SESSION_REL_GEOM.get(rid), hasVia ? null : result.wayIdSet);
        if(rr.ok){
          wrote++; SESSION_FETCHED.delete(rid);
          if(rr.partial) thinned.push(`${rid}: ${rr.total}→${rr.saved}way`);
        }
      }
    }
    const relIdsForSeg = result.relIds.filter(r=>r!=null);
    if(relIdsForSeg.length) segRelsSet(seg, relIdsForSeg);
    log.push({t:'info', msg:`　採用relationをキャッシュ保存（新規${wrote}件 / 採用計${relIdsForSeg.length}件${hasVia?'・via区間のため完全保存':''}${thinned.length?` / 間引き ${thinned.join(', ')}`:''}）`});
  }

  if(!result || result.coords.length<2){
    log.push({t:'err', msg:'有効な経路を構築できず → fallback採用'});
    return null;
  }

  saveAdoptedRels(result);
  return finalize(result);

  // ---- 採用結果の共通仕上げ: ログ出力＋未達側の赤点線コネクタ計算 ----
  function finalize(b){
    const uniq=[...new Set(b.relIds)];
    const connectors=[];
    if(b.startGap > NEAR_STATION) connectors.push([[fromCoord[0],fromCoord[1]],[b.coords[0][0],b.coords[0][1]]]);
    if(b.endGap > NEAR_STATION) connectors.push([[b.coords[b.coords.length-1][0],b.coords[b.coords.length-1][1]],[toCoord[0],toCoord[1]]]);
    // partial = 端点ギャップ超過 または solve内でvia中間レグが断絶していた場合
    const isPartial = connectors.length>0 || !!b.partial;
    log.push({t:isPartial?'warn':'ok', msg:`採用: 降車駅ギャップ ${b.endGap.toFixed(0)}m${isPartial?'（未達側を赤点線コネクタで駅まで接続・デバッグ表示）':''}`});
    log.push({t:'info', msg:`　始点ギャップ ${b.startGap.toFixed(0)}m / 終点ギャップ ${b.endGap.toFixed(0)}m`});
    log.push({t:'info', msg:`　経路長 ${(b.routeLen/1000).toFixed(1)}km（直線距離 ${(directLen/1000).toFixed(1)}km）`});
    log.push({t:'info', msg:`　採用relation [${uniq.join(',')||'-'}]（${uniq.length}本）`});
    const ep1=b.coords[0], ep2=b.coords[b.coords.length-1];
    log.push({t:'info', msg:`描画端点1 [${ep1[0].toFixed(4)},${ep1[1].toFixed(4)}] / 端点2 [${ep2[0].toFixed(4)},${ep2[1].toFixed(4)}]`});
    return {coords:b.coords, connectors, partial:isPartial, startGap:b.startGap, endGap:b.endGap};
  }
}
