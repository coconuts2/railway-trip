// =====================================================================
// モバイル縦画面：行程表ボトムシート（下から上にスライド／高さ切替）
// 縦画面のみ有効。つまみをタップで peek→half→full を巡回、ドラッグで任意の高さ→近い段にスナップ。
// =====================================================================
const SHEET_STATES=[ {key:'mini'}, {key:'third'}, {key:'full'} ];
let sheetIdx=1;  // 既定=1/3。つまみ/タイトルのタップで 1/3→全画面→1行→1/3 と巡回
function isPortraitPhone(){
  return window.matchMedia('(max-width:768px) and (orientation:portrait)').matches;
}
// シートが取りうる最大高さ＝#mainの実高さ（可視ビューポート−ヘッダー）。取得不可なら可視ビューポートで代用。
function sheetMaxH(){
  const m=document.getElementById('main');
  if(m){ const h=m.getBoundingClientRect().height; if(h>0) return h; }
  return (window.visualViewport ? window.visualViewport.height : window.innerHeight);
}
// mini＝つまみ＋パネル見出し＋約1行。third＝地図エリアの1/3。full＝全画面。
function calHeadH(){ const h=document.getElementById('cal-head'); const v=h?h.getBoundingClientRect().height:0; return v>0?Math.ceil(v):44; }
// 各段の高さ(px)。% を使わず実pxで確定指定し、#calendar-body{flex:1} が0pxに潰れないようにする。
function stateH(idx){
  const max=sheetMaxH(), k=SHEET_STATES[idx].key;
  const mini=Math.min(22+calHeadH()+34, Math.round(max*0.35)); // つまみ22px+見出し+1行分
  if(k==='mini') return mini;
  if(k==='third') return Math.max(Math.round(max/3), mini+40); // miniと必ず差をつける
  return max; // full=#mainを満たす（アプリのヘッダーは残す）
}
function applySheet(){
  const panel=document.getElementById('panel');
  if(!panel) return;
  if(!isPortraitPhone()){ panel.style.removeProperty('--sheet-h'); return; }
  panel.style.setProperty('--sheet-h', stateH(sheetIdx)+'px');
}
function cycleSheet(){ sheetIdx=(sheetIdx+1)%SHEET_STATES.length; applySheet(); }
function initSheetDrag(){
  const handle=document.getElementById('sheet-handle');
  const panel=document.getElementById('panel');
  const head=document.getElementById('cal-head');
  if(!handle||!panel) return;
  let startY=0,startH=0,dragging=false,moved=false,startEl=null;
  const onStart=(y,tgt)=>{ if(!isPortraitPhone())return; dragging=true;moved=false;startY=y;startEl=tgt;
    startH=panel.getBoundingClientRect().height; panel.classList.add('dragging'); };
  const onMove=y=>{ if(!dragging)return; const dy=startY-y; if(Math.abs(dy)>4)moved=true;
    const max=sheetMaxH(); let h=startH+dy; h=Math.max(60,Math.min(max,h));
    panel.style.setProperty('--sheet-h',h+'px'); };
  const onEnd=()=>{ if(!dragging)return; dragging=false; panel.classList.remove('dragging');
    if(!moved){                                        // 動かさなければタップ
      const okTap=startEl && startEl.closest && startEl.closest('#sheet-handle, #cal-title');
      if(okTap) cycleSheet(); else applySheet();       // 段送りはつまみ/タイトルのみ（チェック等の操作は妨げない）
      return; }
    const curH=panel.getBoundingClientRect().height;   // 現在高さに最も近い段へスナップ
    let best=0,bd=1e9; SHEET_STATES.forEach((s,i)=>{const d=Math.abs(stateH(i)-curH); if(d<bd){bd=d;best=i;}});
    sheetIdx=best; applySheet(); };
  const bind=surf=>{
    surf.addEventListener('touchstart',e=>onStart(e.touches[0].clientY,e.target),{passive:true});
    surf.addEventListener('touchmove',e=>{ onMove(e.touches[0].clientY); if(dragging&&moved)e.preventDefault(); },{passive:false});
    surf.addEventListener('touchend',onEnd);
    surf.addEventListener('mousedown',e=>{ onStart(e.clientY,e.target); if(isPortraitPhone())e.preventDefault(); });
  };
  bind(handle); if(head) bind(head);                   // つまみ＋見出しをドラッグ面に（掴みやすく）
  window.addEventListener('mousemove',e=>onMove(e.clientY));
  window.addEventListener('mouseup',onEnd);
  window.addEventListener('orientationchange',()=>setTimeout(applySheet,250));
  window.addEventListener('resize',applySheet);
}
// ===== PC/タブレット: パネル幅のドラッグリサイズ（地図との境界#panel-resizer） =====
// 220px〜画面幅70%でクランプし localStorage(rtm_panelW) に保存。縦画面シート時はインライン幅を解除して非干渉。
function initPanelResize(){
  const rz=document.getElementById('panel-resizer');
  const panel=document.getElementById('panel');
  const main=document.getElementById('main');
  if(!rz||!panel||!main) return;
  let PANEL_W=0;
  try{ PANEL_W=parseInt(localStorage.getItem('rtm_panelW')||'0',10)||0; }catch(e){}
  let lastInv=0;
  const inval=final=>{ if(!map) return; const now=Date.now();
    if(final || now-lastInv>80){ lastInv=now; try{ map.invalidateSize({pan:false}); }catch(e){} } };
  const apply=px=>{
    const maxW=Math.max(260, Math.round(window.innerWidth*0.7));
    px=Math.round(Math.min(maxW, Math.max(220, px)));
    panel.style.width=px+'px'; panel.style.minWidth=px+'px';
    PANEL_W=px; inval(false); return px;
  };
  const sync=()=>{ if(isPortraitPhone()){ panel.style.removeProperty('width'); panel.style.removeProperty('min-width'); }
                   else if(PANEL_W) apply(PANEL_W); };
  sync();
  const save=()=>{ try{ localStorage.setItem('rtm_panelW', String(PANEL_W)); }catch(e){} };
  const fromX=x=> main.getBoundingClientRect().right - x;
  let dragging=false;
  rz.addEventListener('mousedown',e=>{ dragging=true; document.body.classList.add('col-resizing'); e.preventDefault(); });
  window.addEventListener('mousemove',e=>{ if(dragging) apply(fromX(e.clientX)); });
  window.addEventListener('mouseup',()=>{ if(!dragging)return; dragging=false;
    document.body.classList.remove('col-resizing'); save(); inval(true); });
  rz.addEventListener('touchstart',()=>{ dragging=true; },{passive:true});
  rz.addEventListener('touchmove',e=>{ if(dragging){ apply(fromX(e.touches[0].clientX)); e.preventDefault(); } },{passive:false});
  rz.addEventListener('touchend',()=>{ if(!dragging)return; dragging=false; save(); inval(true); });
  window.addEventListener('resize',sync);
  window.addEventListener('orientationchange',()=>setTimeout(sync,250));
}

// 乗降駅の○（白丸＋濃グレー縁）。専用pane(stationPane)で路線の上に描画。クリックは透過。
function stationDot(latlng){
  return L.circleMarker(latlng,{ radius:4.5, color:'#374151', weight:2,
    fillColor:'#ffffff', fillOpacity:1, opacity:0.95,
    pane:'stationPane', renderer:STATION_RENDERER, interactive:false });
}
// 区間の乗車駅(fallback始点)・降車駅(fallback終点)に○を作る。始終点が同座標なら1つ。
function makeStations(seg){
  const fb=seg.fallback||[]; if(!fb.length) return [];
  const a=fb[0], b=fb[fb.length-1], out=[];
  if(a&&a.length>=2) out.push(stationDot([a[0],a[1]]));
  if(b&&b.length>=2 && (b[0]!==a[0]||b[1]!==a[1])) out.push(stationDot([b[0],b[1]]));
  return out;
}

function makePl(coords, seg, isFallback){
  const t=T[seg.type]||{color:'#888',w:3};
  // 囲い(アウトライン)は廃止。fallback(推定直線)のみ点線、OSM実ジオメトリは実線。
  const pl=L.polyline(coords,{color:t.color,weight:t.w,opacity:0.9,
    dashArray:isFallback?FALLBACK_DASH:null, lineCap:'round', lineJoin:'round'});
  pl._baseW=t.w; pl._active=false; pl._fallback=!!isFallback;
  pl.bindTooltip(`<b>${seg.name}</b><br>${seg.from} <b>${seg.dep}</b> → ${seg.to} <b>${seg.arr}</b><br><span style="color:#666">${seg.note}</span>`,{sticky:true,direction:'top'});
  pl.on('mouseover',function(){if(!this._active)this.setStyle({weight:this._baseW+2,opacity:1});});
  pl.on('mouseout',function(){if(!this._active)this.setStyle({weight:this._baseW,opacity:0.9});});
  pl.on('click',()=>selectSeg(seg.di,seg.si));
  return pl;
}
function dayVisible(di){ return DAY_VISIBLE[di]!==false; }
function setLayerVisible(layer,on){
  if(!layer) return;
  if(on){ if(!map.hasLayer(layer)) layer.addTo(map); }
  else { if(map.hasLayer(layer)) map.removeLayer(layer); }
}
// この区間が「未達/直線のみ」フィルタを通過するか（OSM完全成功🗺はDOT_ONLY時に隠す）
function isDotSeg(key){
  const lg=LOG[key];
  if(!lg) return true;                        // 未判定（ロード中）は隠さない
  if(lg.result==='osm' && !lg.partial) return false; // 🗺 完全成功 → 隠す対象
  return true;                                // 🔶部分・⚠fallback・➖skip・error は残す
}
// 区間の最終的な表示可否（日別ON かつ （DOT_ONLY無効 または 点線区間））
function segShouldShow(seg){
  const key=`${seg.di}-${seg.si}`;
  return dayVisible(seg.di) && (!DOT_ONLY || isDotSeg(key));
}
// 1区間のレイヤ表示を現在の設定に同期
function syncSegVisibility(seg){
  const ent=plMap[`${seg.di}-${seg.si}`]; if(!ent) return;
  const on=segShouldShow(seg);
  setLayerVisible(ent.osm,on); setLayerVisible(ent.fallback,on);
  (ent.conn||[]).forEach(c=>setLayerVisible(c,on));
  (ent.stations||[]).forEach(m=>setLayerVisible(m,on));
}
function syncAllVisibility(){ for(const seg of SEGS) syncSegVisibility(seg); }

// 日別表示切替（ロード進行中でもplMapに入っている分は即反映）
function toggleDay(di,on){
  DAY_VISIBLE[di]=on;
  for(const seg of SEGS){ if(seg.di===di) syncSegVisibility(seg); }
  const all=document.getElementById('chk-all-days');
  if(all){
    const dis=[...new Set(SEGS.map(s=>s.di))];
    all.checked = dis.every(d=>DAY_VISIBLE[d]!==false);
  }
}
function toggleAllDays(on){
  const dis=[...new Set(SEGS.map(s=>s.di))];
  for(const d of dis){
    DAY_VISIBLE[d]=on;
    const chk=document.getElementById(`chk-day-${d}`); if(chk) chk.checked=on;
  }
  syncAllVisibility();
}
// 「未達/直線のみ表示」トグル: OSM完全成功線を隠し、点線（部分描画・直線）だけ残す
function toggleDotOnly(on){
  DOT_ONLY=on;
  syncAllVisibility();
}
// 未達側コネクタ（経路端点→駅の赤点線。採用way・分断箇所の目視デバッグ用）
function makeConnector(c){
  return L.polyline(c,{color:'#d00000',weight:2,dashArray:'2,6',opacity:0.9});
}
function putFallback(seg){
  if(!seg.fallback?.length) return;
  const key=`${seg.di}-${seg.si}`;
  if(plMap[key]?.osm||plMap[key]?.fallback) return;
  const pl=makePl(seg.fallback,seg,true);   // fallback=点線
  const e=plMap[key]||{};
  const stations=e.stations||makeStations(seg);
  plMap[key]={fallback:pl, stations};
  if(segShouldShow(seg)){ setLayerVisible(pl, true); stations.forEach(m=>setLayerVisible(m,true)); }
}
function putOsm(seg,coords,connectors){
  const key=`${seg.di}-${seg.si}`;
  const e=plMap[key]||{};
  if(e.fallback){ setLayerVisible(e.fallback,false); delete e.fallback; }
  if(e.osm) setLayerVisible(e.osm,false);
  if(e.conn)e.conn.forEach(c=>map.removeLayer(c));
  const pl=makePl(coords,seg,false);   // OSM実ジオメトリ=実線
  const conn=(connectors||[]).map(makeConnector);
  const stations=e.stations||makeStations(seg);   // fallback時に作った○を引き継ぐ
  plMap[key]={osm:pl, conn, stations};
  if(segShouldShow(seg)){ setLayerVisible(pl, true); conn.forEach(c=>c.addTo(map)); stations.forEach(m=>setLayerVisible(m,true)); }
}
function getActivePl(di,si){ const e=plMap[`${di}-${si}`]; return e?.osm||e?.fallback||null; }

function resetActive(){
  if(activePl){activePl._active=false;activePl.setStyle({weight:activePl._baseW,opacity:0.9});activePl=null;}
  if(activeRow){activeRow.classList.remove('active');activeRow=null;}
}
function selectSeg(di,si){
  resetActive();
  const pl=getActivePl(di,si); if(!pl)return;
  pl._active=true; pl.setStyle({weight:pl._baseW+3,opacity:1}); activePl=pl;
  const ent=plMap[`${di}-${si}`];
  const items=[pl, ...((ent&&ent.conn)||[])];
  try{ map.fitBounds(L.featureGroup(items).getBounds(),{padding:[50,50]}); }
  catch(e){ map.fitBounds(pl.getBounds(),{padding:[50,50]}); }
  const row=document.getElementById(`r-${di}-${si}`);
  if(row){row.classList.add('active');row.scrollIntoView({block:'nearest'});activeRow=row;}
  const tb=document.getElementById(`tg-${di}-${si}`);
  if(tb){tb.classList.add('active');tb.scrollIntoView({block:'nearest',inline:'nearest'});activeRow=tb;}
  const seg=SEGS.find(s=>s.di===di&&s.si===si);
  if(seg)showDet(seg);
}
function showDet(seg){
  const t=T[seg.type], d=seg.detail||{};
  document.getElementById('det-title').textContent=seg.name;
  const body=document.getElementById('det-body'); body.innerHTML='';
  const badge=document.createElement('div'); badge.className='det-badge';
  badge.style.cssText=`background:${t.color}22;color:${t.color}`; badge.textContent=t.label;
  body.appendChild(badge);
  const route=document.createElement('div'); route.className='det-route';
  const h3=document.createElement('h3'); h3.textContent=`${seg.from} ${seg.dep} → ${seg.to} ${seg.arr}`;
  const p=document.createElement('p'); p.textContent=seg.note;
  route.appendChild(h3); route.appendChild(p); body.appendChild(route);
  [['tip','box-tip'],['warn','box-warn'],['info','box-info']].forEach(([k,cls])=>{
    if(d[k]){const el=document.createElement('div');el.className=cls;el.textContent=d[k];body.appendChild(el);}
  });
  document.getElementById('det').style.display='block';
}
function closeDet(){ document.getElementById('det').style.display='none'; resetActive(); }

// ===== 行程表（カレンダー）表示 =====
// itinerary の各区間を日別の縦型タイムライン（駅ノード＋列車エッジ）で表示する。
// 色は定数Tを単一ソースに使用。各日ヘッダの☑で地図の日別表示を切替。

// #rrggbb → 薄い背景tint（alpha 8桁hexを付与）。不正値はフォールバック。
function calTint(hex){
  return /^#[0-9a-fA-F]{6}$/.test(hex||'') ? hex+'16' : '#f2f2f4';
}
// "HH:MM" 2点間の所要分（日跨ぎは+24h）。解釈不能は0。
function calDurMin(dep, arr){
  const p=s=>{ const m=/^(\d{1,2}):(\d{2})$/.exec((s||'').trim()); return m?(+m[1])*60+(+m[2]):null; };
  const a=p(dep), b=p(arr);
  if(a==null||b==null) return 0;
  let d=b-a; if(d<0) d+=1440; return d;
}
// 移動時間(分) → "X時間Y分"/"Y分"。0や不明は空文字。
function fmtDur(mins){ if(!mins||mins<=0) return ''; const h=Math.floor(mins/60), m=mins%60; return h>0?(m>0?`${h}時間${m}分`:`${h}時間`):`${m}分`; }

let CAL_MODE='list';   // 'list' | 'time'
let TG_HOUR=44;        // タイム表示の1時間あたりpx（－/＋で可変。CSS --tg-hour と連動）
const TG_HOUR_MIN=24, TG_HOUR_MAX=160;
function setCalMode(m){
  if(CAL_MODE===m) return;
  CAL_MODE=m;
  const bl=document.getElementById('vt-list'), bt=document.getElementById('vt-time');
  if(bl) bl.classList.toggle('on', m==='list');
  if(bt) bt.classList.toggle('on', m==='time');
  const z=document.getElementById('tg-zoom');
  if(z) z.style.display = (m==='time') ? 'flex' : 'none';
  renderCalendarView();
}
function renderCalendarView(){
  const cal=document.getElementById('calendar-body');
  if(!cal || !Array.isArray(SEGS) || !SEGS.length) return;
  cal.classList.toggle('time-mode', CAL_MODE==='time');
  if(CAL_MODE==='time'){ renderTimeGrid(cal); return; }
  renderListView(cal);
}

// ===== タイム表示（Googleカレンダー風）。0:00-24:00 の縦軸に、各区間を dep→arr の位置・縦幅のブロックで置く =====
// 1時間=44px / 日ヘッダ=30px（CSS .tg-hour/.tg-col/.tg-day-head と対応）。クリックで selectSeg（リストと同じ地図連動）。
function renderTimeGrid(cal, noAutoScroll){
  const HOUR=TG_HOUR;
  cal.style.setProperty('--tg-hour', HOUR+'px');
  const pMin=s=>{ const m=/^(\d{1,2}):(\d{2})$/.exec((s||'').trim()); return m?(+m[1])*60+(+m[2]):null; };
  cal.innerHTML='';
  const el=(t,c)=>{ const e=document.createElement(t); if(c) e.className=c; return e; };
  const wrap=el('div','tg-scroll');
  const ax=el('div','tg-axis');
  ax.appendChild(el('div','tg-corner'));
  for(let h=0;h<24;h++){ const hv=el('div','tg-hour'); hv.textContent=h+':00'; ax.appendChild(hv); }
  wrap.appendChild(ax);
  const byDay=new Map();
  for(const s of SEGS){ (byDay.get(s.di)||byDay.set(s.di,[]).get(s.di)).push(s); }
  const days=[...byDay.keys()].sort((a,b)=>a-b);
  let firstMin=24*60;
  days.forEach(di=>{
    const segs=byDay.get(di).slice().sort((a,b)=>a.si-b.si);
    const day=el('div','tg-day');
    const head=el('div','tg-day-head');
    const chk=document.createElement('input'); chk.type='checkbox'; chk.id='chk-day-'+di;
    chk.checked=DAY_VISIBLE[di]!==false; chk.onchange=()=>toggleDay(di,chk.checked);
    const lb=document.createElement('span'); lb.textContent=DAY_LABELS[di]||('Day '+(di+1));
    lb.onclick=()=>{ chk.checked=!chk.checked; toggleDay(di,chk.checked); };
    head.appendChild(chk); head.appendChild(lb); day.appendChild(head);
    const col=el('div','tg-col');
    // 区間→ブロック（時間が重なる場合はレーン分割で横に並べる）
    const items=[];
    for(const s of segs){
      const a=pMin(s.dep); if(a==null) continue;
      let b=pMin(s.arr); if(b==null||b<=a) b=a+1;      // 欠損/同時刻は最小1分
      items.push({s, a, b:Math.min(b,1440)});
      if(a<firstMin) firstMin=a;
    }
    items.sort((x,y)=>x.a-y.a||x.b-y.b);
    let cluster=[], clusterEnd=-1;
    const flush=()=>{ if(!cluster.length) return;
      const laneEnd=[];
      for(const it of cluster){
        let l=laneEnd.findIndex(e=>e<=it.a);
        if(l<0){ l=laneEnd.length; laneEnd.push(0); }
        laneEnd[l]=it.b; it.lane=l;
      }
      for(const it of cluster) it.lanes=laneEnd.length;
      cluster=[];
    };
    for(const it of items){
      if(it.a>=clusterEnd){ flush(); clusterEnd=it.b; }
      else clusterEnd=Math.max(clusterEnd,it.b);
      cluster.push(it);
    }
    flush();
    for(const it of items){
      const {s,a,b,lane,lanes}=it;
      const t=T[s.type]||{color:'#9e9e9e'};
      const durPx=(b-a)/60*HOUR;
      const block=el('div','tg-block'+(durPx<26?' tiny':''));
      block.id=`tg-${s.di}-${s.si}`;
      block.style.top=(a/60*HOUR)+'px';
      block.style.height=Math.max(durPx,12)+'px';
      const w=100/lanes;
      block.style.left=`calc(${lane*w}% + 2px)`;
      block.style.width=`calc(${w}% - 5px)`;
      block.style.borderLeftColor=t.color;
      block.style.background=calTint(t.color);
      const tm=el('div','tb-time'); tm.textContent=`${s.dep}–${s.arr}`;
      const nm=el('div','tb-name'); nm.style.color=t.color; nm.textContent=s.name;
      block.appendChild(tm); block.appendChild(nm);
      block.title=`${s.dep}–${s.arr} ${s.name}`;
      block.onclick=()=>selectSeg(s.di,s.si);
      col.appendChild(block);
    }
    day.appendChild(col);
    wrap.appendChild(day);
  });
  cal.appendChild(wrap);
  if(!noAutoScroll){
    // 最初の行程の少し上へ自動スクロール（ズーム時は呼び元が中央時刻を維持するためスキップ）
    cal.scrollTop=Math.max(0, ((firstMin===24*60?8*60:firstMin)/60)*HOUR-36);
  }
}

// タイム表示の拡大/縮小。フレーム（日付ヘッダ・時間軸の構造）は保ち、1時間あたりのpxだけ変える。
// ズーム前後で「画面中央に見えている時刻」を維持するようスクロール位置を補正する。
function tgZoom(f){
  if(CAL_MODE!=='time') return;
  const cal=document.getElementById('calendar-body'); if(!cal) return;
  const old=TG_HOUR;
  TG_HOUR=Math.round(Math.min(TG_HOUR_MAX, Math.max(TG_HOUR_MIN, TG_HOUR*f)));
  if(TG_HOUR===old) return;
  const headH=30;  // .tg-day-head の高さ
  const centerMin=Math.max(0,(cal.scrollTop + cal.clientHeight/2 - headH))/old*60;
  renderTimeGrid(cal, true);
  cal.scrollTop=Math.max(0, centerMin/60*TG_HOUR - cal.clientHeight/2 + headH);
}

function renderListView(cal){
  cal.innerHTML='';

  const el=(tag,cls)=>{ const e=document.createElement(tag); if(cls) e.className=cls; return e; };

  // 着駅(seg.to)座標 / 次発駅(seg.from)座標（fallback端点）
  const coordTo=s=>{ const fb=s.fallback||[]; return fb.length?fb[fb.length-1]:null; };
  const coordFrom=s=>{ const fb=s.fallback||[]; return fb.length?fb[0]:null; };
  // 着駅と次発駅が「同一駅」か：名称＋座標が両方一致する場合のみ true
  const sameStation=(a,b)=>{
    if(a.to!==b.from) return false;
    const ca=coordTo(a), cb=coordFrom(b);
    if(!ca||!cb) return false;            // 座標不明は別駅扱い（両一致が条件のため）
    return ca[0]===cb[0] && ca[1]===cb[1];
  };

  // 時刻＋(着/発)サフィックスのまとまり
  const timeTw=(t,suffix)=>{
    const tw=el('span','cal-node-tw');
    const tm=el('span','cal-node-time'); tm.textContent=t||'--:--';
    const sf=el('span','cal-node-suffix'); sf.textContent=suffix;
    tw.appendChild(tm); tw.appendChild(sf); return tw;
  };
  // 駅ノード：着時刻・発時刻を「改行で縦並び」。駅名は最終行（発があれば発行、なければ着行）に。
  const stopNode=({arr,dep,name,kind,tag})=>{
    const n=el('div','cal-node'+(kind?' '+kind:''));
    n.appendChild(el('div','cal-node-dot'));
    const both = arr!=null && dep!=null;
    const addName=(ln)=>{ const nm=el('span','cal-node-name'); nm.textContent=name; ln.appendChild(nm); if(tag){ const tg=el('span','cal-node-tag'); tg.textContent=tag; ln.appendChild(tg); } };
    if(arr!=null){                                   // 着行（両方あれば着のみ）
      const ln=el('div','cal-node-line'); ln.appendChild(timeTw(arr,'着'));
      if(!both) addName(ln);
      n.appendChild(ln);
    }
    if(dep!=null){                                   // 発行（駅名・タグはここ）
      const ln=el('div','cal-node-line'); ln.appendChild(timeTw(dep,'発'));
      addName(ln);
      n.appendChild(ln);
    }
    return n;
  };
  // 列車エッジ：色付きボックス。路線名＋移動時間（小さい字）。warn時のみnote。高さは移動時間に比例。
  const edgeEl=seg=>{
    const t=T[seg.type]||{color:'#9e9e9e'};
    const edge=el('div','cal-edge');
    edge.style.borderLeftColor=t.color;
    edge.style.background=calTint(t.color);
    const warn=!!seg.warn;
    const dur=calDurMin(seg.dep, seg.arr);
    const contentMin=warn?34:21;                      // 内容が収まる最小高（1行=21px,警告2行=34px）
    const h=Math.max(contentMin, Math.round(18 + Math.min(dur,210)*0.5));
    edge.style.minHeight=h+'px';
    const head=el('div','cal-edge-head');
    const nm=el('span','cal-edge-name'); nm.style.color=t.color; nm.textContent=seg.name;
    head.appendChild(nm);
    const ds=fmtDur(dur);
    if(ds){ const du=el('span','cal-edge-dur'); du.textContent=ds; head.appendChild(du); }
    edge.appendChild(head);
    if(warn && seg.note){ const nt=el('div','cal-edge-note'); nt.textContent=seg.note; edge.appendChild(nt); }
    edge.onclick=()=>selectSeg(seg.di, seg.si);        // 地図連動
    return edge;
  };

  // 日(di)ごとにグループ化（全区間を旅程として表示。fallbackSkipも含む）
  const byDay=new Map();
  for(const seg of SEGS){ (byDay.get(seg.di)||byDay.set(seg.di,[]).get(seg.di)).push(seg); }
  const days=[...byDay.keys()].sort((a,b)=>a-b);
  const tripStart=SEGS[0];

  days.forEach((di,dIdx)=>{
    const segs=byDay.get(di).slice().sort((a,b)=>a.si-b.si);
    const isLastDay=dIdx===days.length-1;
    const dayEl=el('div','cal-day');

    // 日ヘッダ：☑（地図の日別表示）＋ラベル＋駅チェーン概要
    const head=el('div','cal-day-head');
    const top=el('div','cal-day-top');
    const chk=document.createElement('input'); chk.type='checkbox'; chk.className='cal-day-chk'; chk.id='chk-day-'+di;
    chk.checked = DAY_VISIBLE[di]!==false;
    chk.onchange=()=>toggleDay(di, chk.checked);
    const title=el('span','cal-day-title'); title.textContent=DAY_LABELS[di]||('Day '+(di+1));
    title.onclick=()=>{ chk.checked=!chk.checked; toggleDay(di, chk.checked); };
    top.appendChild(chk); top.appendChild(title);
    const route=el('div','cal-day-route');
    const chain=[];
    segs.forEach((s,i)=>{ if(i===0) chain.push(s.from); if(chain[chain.length-1]!==s.to) chain.push(s.to); });
    route.textContent=chain.join(' → ');
    head.appendChild(top); head.appendChild(route);
    dayEl.appendChild(head);

    // タイムライン
    const tl=el('div','cal-tl');
    // 出発駅（その日の最初の乗車駅）：発時刻のみ
    tl.appendChild(stopNode({dep:segs[0].dep, name:segs[0].from,
      kind: segs[0]===tripStart?'start':'', tag: segs[0]===tripStart?'🚩 出発':''}));

    segs.forEach((seg,i)=>{
      tl.appendChild(edgeEl(seg));
      const next=segs[i+1];
      if(!next){
        // その日の終点：着時刻のみ＝宿泊地（最終日はゴール）
        tl.appendChild(stopNode({arr:seg.arr, name:seg.to, kind:'stay', tag:isLastDay?'🏁 到着':'🏨 宿泊'}));
      } else if(sameStation(seg,next)){
        // 着駅＝次発駅（名称・座標とも一致）：1ノードに着＋発、駅名は1回
        tl.appendChild(stopNode({arr:seg.arr, dep:next.dep, name:seg.to}));
      } else {
        // 別駅：着ノード（着時刻＋着駅名）＋発ノード（発時刻＋次発駅名）
        tl.appendChild(stopNode({arr:seg.arr, name:seg.to}));
        tl.appendChild(stopNode({dep:next.dep, name:next.from}));
      }
    });

    dayEl.appendChild(tl);
    cal.appendChild(dayEl);
  });
}
function buildLegend(){
  const lg=document.getElementById('legend');
  for(const [,t] of Object.entries(T)){
    const el=document.createElement('div'); el.className='leg-item';
    const ln=document.createElement('div'); ln.className='leg-line'; ln.style.background=t.color;
    el.appendChild(ln); el.appendChild(document.createTextNode(t.label)); lg.appendChild(el);
  }
  // 乗降駅（○）
  const st=document.createElement('div'); st.className='leg-item';
  const dot=document.createElement('span');
  dot.style.cssText='width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid #374151;display:inline-block;box-sizing:border-box;';
  st.appendChild(dot); st.appendChild(document.createTextNode('乗降駅')); lg.appendChild(st);
  // 直線（推定／fallback）= 点線
  const fb=document.createElement('div'); fb.className='leg-item';
  const fl=document.createElement('div'); fl.className='leg-line';
  fl.style.cssText='background:repeating-linear-gradient(90deg,#888 0 6px,transparent 6px 11px);';
  fb.appendChild(fl); fb.appendChild(document.createTextNode('直線（推定）')); lg.appendChild(fb);
  // 未達コネクタ（経路端点→駅の赤点線）
  const el=document.createElement('div'); el.className='leg-item';
  const ln=document.createElement('div'); ln.className='leg-line';
  ln.style.cssText='background:repeating-linear-gradient(90deg,#d00000 0 3px,transparent 3px 7px);';
  el.appendChild(ln); el.appendChild(document.createTextNode('未達コネクタ')); lg.appendChild(el);
}

// 点線（未発見⚠ / 部分描画🔶）区間のジャンプリストをパネル上部に生成。
// ➖skip（意図的にAPI取得しない区間）は「発見失敗」ではないので除外。
// 見出しクリックで本体を折りたたみ可能（リストが長い時に通常路線を見やすくする）。開閉状態は永続化。
function buildDotJump(){
  const box=document.getElementById('dot-jump');
  if(!box) return;
  box.innerHTML='';
  const items=[];
  for(const seg of SEGS){
    const key=`${seg.di}-${seg.si}`;
    const lg=LOG[key]; if(!lg) continue;
    const isPartial = lg.result==='osm' && lg.partial;
    const isFallback = lg.result==='fallback' || lg.result==='error';
    if(!isPartial && !isFallback) continue;
    items.push({seg, key, lg, isPartial});
  }
  if(!items.length){ box.classList.add('empty'); return; }
  box.classList.remove('empty');

  let collapsed = false;
  try { collapsed = localStorage.getItem('dotJumpCollapsed')==='1'; } catch(e){}

  const head=document.createElement('div'); head.className='dj-head';
  const caret=document.createElement('span'); caret.className='dj-caret';
  const headText=document.createElement('span');
  headText.textContent=`未発見/部分の区間（${items.length}）`;
  head.appendChild(caret); head.appendChild(headText);

  const list=document.createElement('div'); list.className='dj-list';
  for(const {seg, key, lg, isPartial} of items){
    const it=document.createElement('div'); it.className='dj-item';
    const ic=document.createElement('span'); ic.className='dj-icon'; ic.textContent=isPartial?'🔶':'⚠';
    const nm=document.createElement('span'); nm.className='dj-name'; nm.textContent=seg.name;
    const dy=document.createElement('span'); dy.className='dj-day'; dy.textContent=`${seg.di+1}日目`;
    it.appendChild(ic); it.appendChild(nm);
    if(isPartial && lg.endGap!=null){
      const gp=document.createElement('span'); gp.className='dj-gap';
      gp.textContent = lg.endGap>=1000 ? `残${(lg.endGap/1000).toFixed(1)}km` : `残${Math.round(lg.endGap)}m`;
      it.appendChild(gp);
    }
    it.appendChild(dy);
    it.onclick=()=>{
      if(!dayVisible(seg.di)){ const c=document.getElementById(`chk-day-${seg.di}`); if(c){c.checked=true;} toggleDay(seg.di,true); }
      closeLog();
      selectSeg(seg.di,seg.si);
    };
    list.appendChild(it);
  }

  const applyCollapsed = () => {
    box.classList.toggle('collapsed', collapsed);
    caret.textContent = collapsed ? '▶' : '▼';
    headText.textContent = collapsed ? `未発見/部分の区間（${items.length}）— クリックで開く` : `未発見/部分の区間（${items.length}）— クリックで閉じる`;
  };
  head.onclick=()=>{
    collapsed=!collapsed;
    try { localStorage.setItem('dotJumpCollapsed', collapsed?'1':'0'); } catch(e){}
    applyCollapsed();
  };
  applyCollapsed();

  box.appendChild(head);
  box.appendChild(list);
}

// =====================================================================
// ログウィンドウ
// =====================================================================
function openLog(focusKey){
  renderLog(focusKey);
  document.getElementById('log-overlay').style.display='block';
}
function closeLog(){ document.getElementById('log-overlay').style.display='none'; }

// ログ全体をテキスト化してダウンロード（画面のコピー不要に）
function downloadLog(){
  const keys=Object.keys(LOG);
  const nOk=keys.filter(k=>LOG[k].result==='osm').length;
  const nFb=keys.filter(k=>LOG[k].result==='fallback').length;
  const nErr=keys.filter(k=>LOG[k].result==='error').length;
  const nSkip=keys.filter(k=>LOG[k].result==='skip').length;
  const nF=keys.filter(k=>LOG[k].strategy==='F').length;
  const nA=keys.filter(k=>LOG[k].strategy==='A').length;
  const nB=keys.filter(k=>LOG[k].strategy==='B').length;
  const nPart=keys.filter(k=>LOG[k].result==='osm'&&LOG[k].partial).length;
  const nAtoB=keys.filter(k=>LOG[k].aToB).length;
  const lines=[`合計${keys.length}区間 / API成功(OSM描画)${nOk}（高速パス ${nF} / 戦略A ${nA} / 戦略B ${nB} / うち部分描画🔶 ${nPart}） ・ fallback採用${nFb} ・ エラー${nErr} ・ skip(直線)${nSkip} ・ 戦略A不達→B試行 ${nAtoB}`, totalTimeStr(), cacheStats()];
  for(const seg of SEGS){
    const lg=LOG[`${seg.di}-${seg.si}`];
    if(!lg) continue;
    const icon = lg.result==='osm'?(lg.partial?'🔶':'🗺') : lg.result==='error'?'❌' : lg.result==='skip'?'➖':'⚠';
    lines.push(icon, seg.name, lg.totalTime!=null?`${lg.totalTime.toFixed(1)}秒`:'');
    for(const s of lg.steps) lines.push(s.msg);
  }
  const blob=new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const ts=new Date().toISOString().slice(0,16).replace(/[:T]/g,'');
  a.href=url; a.download=`rail_log_${ts}.txt`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderLog(focusKey){
  const filter=document.getElementById('log-filter').value;
  const body=document.getElementById('log-body'); body.innerHTML='';

  // サマリー
  const keys=Object.keys(LOG);
  const nOk=keys.filter(k=>LOG[k].result==='osm').length;
  const nFb=keys.filter(k=>LOG[k].result==='fallback').length;
  const nErr=keys.filter(k=>LOG[k].result==='error').length;
  const nSkip=keys.filter(k=>LOG[k].result==='skip').length;
  const nF=keys.filter(k=>LOG[k].strategy==='F').length;
  const nA=keys.filter(k=>LOG[k].strategy==='A').length;
  const nB=keys.filter(k=>LOG[k].strategy==='B').length;
  const nPart=keys.filter(k=>LOG[k].result==='osm'&&LOG[k].partial).length;
  const nAtoB=keys.filter(k=>LOG[k].aToB).length;
  document.getElementById('log-summary').textContent =
    `合計${keys.length}区間 / API成功(OSM描画)${nOk}（高速パス ${nF} / 戦略A ${nA} / 戦略B ${nB} / うち部分描画🔶 ${nPart}） ・ fallback採用${nFb} ・ エラー${nErr} ・ skip(直線)${nSkip} ・ 戦略A不達→B試行 ${nAtoB}` + ' ｜ ' + totalTimeStr() + ' ｜ ' + cacheStats();

  for(const seg of SEGS){
    const key=`${seg.di}-${seg.si}`;
    const lg=LOG[key];
    if(!lg) continue;
    if(filter==='ok' && lg.result!=='osm') continue;
    if(filter==='fast' && lg.strategy!=='F') continue;
    if(filter==='strategyA' && lg.strategy!=='A') continue;
    if(filter==='strategyB' && lg.strategy!=='B') continue;
    if(filter==='partial' && !(lg.result==='osm'&&lg.partial)) continue;
    if(filter==='fallback' && lg.result!=='fallback') continue;
    if(filter==='error' && lg.result!=='error') continue;

    const segDiv=document.createElement('div'); segDiv.className='log-seg';
    const head=document.createElement('div');
    const statusClass = lg.result==='osm'?(lg.partial?'fallback':'ok') : lg.result==='error'?'error' : 'fallback';
    head.className='log-seg-head '+statusClass;
    const icon = lg.result==='osm'?(lg.partial?'🔶':'🗺') : lg.result==='error'?'❌' : lg.result==='skip'?'➖':'⚠';
    const total = lg.totalTime!=null ? `${lg.totalTime.toFixed(1)}秒` : '';
    const stratName = lg.strategy==='F'?'高速パス':lg.strategy?`戦略${lg.strategy}`:'';
    const stratBadge = stratName ? ` <b>[${stratName}]</b>` : '';
    head.innerHTML=`<span class="log-seg-status">${icon}</span><span class="log-seg-name">${seg.name}${stratBadge}</span><span class="log-seg-time">${total}</span>`;
    const detail=document.createElement('div'); detail.className='log-detail';
    if(focusKey===key) detail.classList.add('open');
    detail.innerHTML = lg.steps.map(s=>{
      const cls = s.t==='ok'?'log-ok':s.t==='warn'?'log-warn':s.t==='err'?'log-err':'log-step';
      return `<span class="${cls}">${escapeHtml(s.msg)}</span>`;
    }).join('\n');
    head.onclick=()=>detail.classList.toggle('open');
    segDiv.appendChild(head); segDiv.appendChild(detail);
    body.appendChild(segDiv);
    if(focusKey===key) setTimeout(()=>head.scrollIntoView({block:'center'}),50);
  }
}
function escapeHtml(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// =====================================================================
// 全区間ロード（シリアル）
// =====================================================================
let done=0;
async function loadAll(){
  const total=SEGS.length;
  WALL_START=performance.now(); WALL_END=null;
  document.getElementById('progress-label').textContent=`0/${total}`;
  for(const seg of SEGS){
    await loadOneSeg(seg);
  }
  WALL_END=performance.now();
  document.getElementById('status-text').textContent='✅ 読み込み完了';
  buildDotJump();
  const allPls=Object.values(plMap).map(e=>e.osm||e.fallback).filter(Boolean);
  if(allPls.length>0){ try{ map.fitBounds(L.featureGroup(allPls).getBounds(),{padding:[20,20]}); }catch(e){} }
  // 案A-1: メモリキャッシュ使用時は完了時にDL確認（メモリはリロード/タブを閉じると消えるため）
  if(USE_MEM_CACHE){
    setTimeout(()=>{
      if(confirm('全区間の描画が完了しました。\n\nメモリ上のキャッシュはリロード/タブを閉じると消えます。\n今すぐキャッシュをダウンロードして保存しますか？')){
        downloadCache();
      }
    }, 600);
  }
}

async function loadOneSeg(seg){
  const key=`${seg.di}-${seg.si}`;
  const t0=performance.now();
  const log=[];
  LOG[key]={steps:log, result:null, totalTime:null};

  document.getElementById('status-text').textContent=`取得中: ${seg.name}`;

  // fallback即描画
  putFallback(seg);

  let result='fallback';
  if(seg.fallbackSkip){
    result='skip';
    log.push({t:'info', msg:'種別: fallbackSkip（新幹線/長距離/短距離特殊区間）'});
  } else if(seg.lineNames||seg.lineName){
    const icon=document.getElementById(`icon-${seg.di}-${seg.si}`);
    let res=null;
    try { res=await fetchRailCoords(seg, log); } catch(e){ log.push({t:'err',msg:'例外: '+e.message}); }
    if(res&&res.coords&&res.coords.length>=2){
      putOsm(seg,res.coords,res.connectors);
      result='osm';
      LOG[key].partial = !!res.partial;
      LOG[key].endGap = res.endGap;
      LOG[key].startGap = res.startGap;
      if(res.partial){
        log.push({t:'warn', msg:'→ 部分経路＋赤点線コネクタで描画（経路未達・分断デバッグ用）'});
        if(icon)icon.textContent='🔶';
      } else {
        log.push({t:'ok', msg:'→ APIの出力を採用して描画'});
        if(icon)icon.textContent='🗺';
      }
    } else {
      result='fallback';
      log.push({t:'warn', msg:'→ fallback（直線/概略）を採用して描画'});
      if(icon)icon.textContent='⚠';
    }
  } else {
    result='skip';
    log.push({t:'info', msg:'路線名指定なし → fallback直線'});
  }

  LOG[key].result = (result==='fallback' && log.some(s=>s.t==='err')) ? 'error' : result;
  if(LOG[key].result==='error') LOG[key].result='fallback'; // エラーでもfallback描画はされている
  // 厳密なerror判定: API試行したが全滅
  if(result==='fallback' && (seg.lineNames||seg.lineName) && log.some(s=>s.msg.includes('データ取得失敗')||s.msg.includes('タイムアウト'))){
    LOG[key].result='error';
  }

  LOG[key].totalTime=(performance.now()-t0)/1000;

  // 採用戦略の判定（ログから）: 高速パス/戦略A/戦略B。OSM描画時のみ持つ。
  if(LOG[key].result==='osm'){
    LOG[key].strategy = log.some(s=>s.msg && s.msg.includes('戦略Bの結果を採用')) ? 'B'
                      : log.some(s=>s.msg && s.msg.includes('高速パス採用')) ? 'F' : 'A';
  } else {
    LOG[key].strategy = null;
  }
  // 戦略A→B移行（戦略Aが降車駅に届かず戦略Bを試行した区間）
  LOG[key].aToB = log.some(s=>s.msg && s.msg.includes('戦略Aで降車駅に到達できず'));

  done++;
  const total=SEGS.length;
  document.getElementById('progress-fill').style.width=Math.round(done/total*100)+'%';
  document.getElementById('progress-label').textContent=`${done}/${total}`;
  // 未発見/部分リストを逐次更新（最後まで待たずに途中経過で見える）
  buildDotJump();
}
